  /* 第 5 题：整百或整百整十 × 一位数的口算说理填空，每次随机生成
     整百（如 600）→ 6 个百乘 2 是 12 个百，也就是 1200
     整百整十（如 230）→ 23 个十乘 3 是 69 个十，也就是 690 */
  function makeWordFill5(){
    const b = rnd(2, 9);
    let A, unit, count;
    if (Math.random() < 0.5){
      count = rnd(2, 9);          /* 整百：2~9 个百 */
      A = count * 100;
      unit = "百";
    } else {
      count = rnd(1, 9) * 10 + rnd(1, 9);   /* 整百整十：11~99 个十 */
      A = count * 10;
      unit = "十";
    }
    return {
      num: 5,
      text: `口算${A}×${b}时,可以想:（）个${unit}乘${b}是（）个${unit}，也就是（）。`,
      ans: [String(count), String(count * b), String(A * b)]
    };
  }

  /* 第 6 题：三位数 × 一位数，每次随机生成；积的位数与最高位按实际结果给出 */
  function makeWordFill6(){
    const a = rnd(100, 999);
    const b = rnd(2, 9);
    const p = a * b;
    const digits = String(p).length;               /* 四位数或三位数 */
    const place = digits === 4 ? "千" : "百";
    return {
      num: 6,
      text: `三位数乘一位数，积可能是（）位数，也可能是（）位数；${a}×${b}的积是（）位数，积的最高位是（）位。`,
      ans: ["三", "四", String(digits === 3 ? "三" : "四"), place]
    };
  }

  /* 第 7 题：三位数 × 一位数的思考过程，每次随机生成
     两种题型各占 50%：
     A) 完整表格，问“算式是（）”，答案为 n×b；
     B) 只显示某一列的数位与对应积，问“结果是（）”，答案为乘积。
     B 型额外提供 tableAns，点击“显示答案”时把隐藏列填充完整。 */
  function makeWordFill7(){
    const names = ["小琪", "小明", "小红", "小华", "小军", "小丽", "小芳"];
    const name = names[rnd(0, names.length - 1)];

    const h = rnd(1, 9) * 100;
    const t = rnd(1, 9) * 10;
    const u = rnd(1, 9);
    const b = rnd(2, 9);
    const n = h + t + u;

    const parts = [String(h), String(t), String(u)];
    const prods = [String(h * b), String(t * b), String(u * b)];
    const fullTable = [["×", ...parts], [String(b), ...prods]];

    if (Math.random() < 0.5){
      /* 原题型：完整表格，问算式 */
      return {
        num: 7,
        text: `${name}计算一道三位数乘一位数时的思考过程如下。`,
        textAfter: "她计算的这道乘法算式是（）。",
        table: fullTable,
        ans: [`${n}×${b}`]
      };
    } else {
      /* 新题型：只显示某一列的数位与对应积，问结果 */
      const show = rnd(0, 2);   /* 0=百位, 1=十位, 2=个位 */
      return {
        num: 7,
        text: `${name}计算一道三位数乘一位数“${n}×${b}”时的思考过程如下。`,
        textAfter: "她计算的这道乘法算式结果是（）。",
        table: [
          ["×", ...parts.map((v, i) => i === show ? v : "")],
          [String(b), ...prods.map((v, i) => i === show ? v : "")]
        ],
        tableAns: fullTable,
        ans: [String(n * b)]
      };
    }
  }

  /* 第 8 题：混合运算的运算顺序，每次随机生成
     覆盖多种混合运算类型——先乘后加/减、先除后加/减、先加/减后乘、
     先加/减后除、连乘、连除（整除）。每类都是恰好两步，
     对应题目格式"应先算（）法,再算（）法，结果是（）"。 */
  function makeWordFill8(){
    /* 每种模式的生成函数返回 { expr, op1, op2, ans }
       op1 / op2 是题目要求的"先算X法/再算X法"的运算类型名 */
    const MODES = [
      /* 1) a × b + c / a × b - c  先乘后加/减 */
      () => {
        const a = rnd(10, 99), b = rnd(2, 9);
        const prod = a * b;
        if (Math.random() < 0.5){
          const c = rnd(1, 50);
          return { expr: `${a}×${b}+${c}`, op1:"乘", op2:"加", ans: String(prod + c) };
        } else {
          const c = rnd(1, prod - 1);
          return { expr: `${a}×${b}-${c}`, op1:"乘", op2:"减", ans: String(prod - c) };
        }
      },
      /* 2) a + b × c / a - b × c  先乘后加/减 */
      () => {
        const b = rnd(10, 99), c = rnd(2, 9);
        const prod = b * c;
        if (Math.random() < 0.5){
          const a = rnd(10, 99);
          return { expr: `${a}+${b}×${c}`, op1:"乘", op2:"加", ans: String(a + prod) };
        } else {
          const a = rnd(prod + 1, prod + 99);
          return { expr: `${a}-${b}×${c}`, op1:"乘", op2:"减", ans: String(a - prod) };
        }
      },
      /* 3) a ÷ b + c / a ÷ b - c  先除后加/减（整除） */
      () => {
        let q, b, a;
        for (;;){
          b = rnd(2, 9);
          const twoDigit = Math.random() < 0.5;
          const qmin = twoDigit ? 10 : 1;
          const qmax = twoDigit ? 99 : 999;
          q = rnd(qmin, qmax); a = b * q;
          if (String(a).length <= 3) break;
        }
        if (Math.random() < 0.5){
          const c = rnd(1, 50);
          return { expr: `${a}÷${b}+${c}`, op1:"除", op2:"加", ans: String(q + c) };
        } else {
          const c = rnd(1, Math.max(1, q - 1));
          return { expr: `${a}÷${b}-${c}`, op1:"除", op2:"减", ans: String(q - c) };
        }
      },
      /* 4) a + b ÷ c / a - b ÷ c  先除后加/减（整除） */
      () => {
        let c, b, q;
        for (;;){
          c = rnd(2, 9);
          const twoDigit = Math.random() < 0.5;
          const qmin = twoDigit ? 10 : 1;
          const qmax = twoDigit ? 99 : 999;
          q = rnd(qmin, qmax); b = c * q;
          if (String(b).length <= 3) break;
        }
        if (Math.random() < 0.5){
          const a = rnd(10, 99);
          return { expr: `${a}+${b}÷${c}`, op1:"除", op2:"加", ans: String(a + q) };
        } else {
          const a = rnd(q + 1, q + 99);
          return { expr: `${a}-${b}÷${c}`, op1:"除", op2:"减", ans: String(a - q) };
        }
      },
      /* 5) a × (b + c) / a × (b - c)  先加/减后乘 */
      () => {
        const a = rnd(2, 9), b = rnd(2, 12);
        if (Math.random() < 0.5){
          const c = rnd(1, 9);
          return { expr: `${a}×(${b}+${c})`, op1:"加", op2:"乘", ans: String(a * (b + c)) };
        } else {
          const c = rnd(1, b - 1);
          return { expr: `${a}×(${b}-${c})`, op1:"减", op2:"乘", ans: String(a * (b - c)) };
        }
      },
      /* 6) a ÷ (b + c) / a ÷ (b - c)  先加/减后除（整除） */
      () => {
        for (let t = 0; t < 200; t++){
          const isAdd = Math.random() < 0.5;
          let b, c, d, q, a;
          if (isAdd){
            b = rnd(2, 8); c = rnd(1, 9 - b);     /* b 上限 8 保证 9-b ≥ 1 */
            d = b + c;
          } else {
            d = rnd(2, 8);
            c = rnd(1, 9 - d); b = c + d;
          }
          const twoDigit = Math.random() < 0.5;
          const qmin = Math.ceil((twoDigit ? 10 : 100) / d);
          const qmax = Math.floor((twoDigit ? 99 : 999) / d);
          if (qmax < qmin) continue;
          q = rnd(qmin, qmax); a = d * q;
          return {
            expr: isAdd ? `${a}÷(${b}+${c})` : `${a}÷(${b}-${c})`,
            op1: isAdd ? "加" : "减",
            op2: "除",
            ans: String(q)
          };
        }
        /* 兜底：如果上面 200 次没找到合适的，退回老模式 */
        for (;;){
          const d = rnd(2, 8), c = rnd(1, 9 - d), b = c + d;
          const qmin = Math.ceil(10 / d), qmax = Math.floor(99 / d);
          if (qmax < qmin) continue;
          const q = rnd(qmin, qmax), a = d * q;
          return { expr: `${a}÷(${b}-${c})`, op1:"减", op2:"除", ans: String(q) };
        }
      },
      /* 7) a + b − c  /  a − b + c  加减混合（同级从左到右）
            先算加再算减，或先算减再算加；中间结果不超 100、最终结果非负 */
      () => {
        if (Math.random() < 0.5){
          /* 先加后减：a + b − c，保证 a+b ≤ 100、a+b > c */
          const a = rnd(10, 80), b = rnd(10, 100 - a);
          const c = rnd(1, a + b - 1);
          return { expr: `${a}+${b}-${c}`, op1:"加", op2:"减", ans: String(a + b - c) };
        } else {
          /* 先减后加：a − b + c，保证 a > b、a − b + c ≤ 100 */
          const a = rnd(20, 99), b = rnd(1, a - 1);
          const c = rnd(1, 100 - (a - b));
          return { expr: `${a}-${b}+${c}`, op1:"减", op2:"加", ans: String(a - b + c) };
        }
      },
      /* 8) a − b − c  连减（同级从左到右）
            先减再减；保证 a > b、a − b > c，两次减法都不出现负数 */
      () => {
        for (;;){
          const a = rnd(30, 199), b = rnd(10, 99);
          if (a <= b) continue;                         /* 第一次减法不能负 */
          const cmax = a - b - 1;
          if (cmax < 1) continue;                      /* 第二次减法也不能负 */
          const c = rnd(1, cmax);
          return { expr: `${a}-${b}-${c}`, op1:"减", op2:"减", ans: String(a - b - c) };
        }
      },
      /* 9) a + b + c  连加（同级从左到右），先加后加 */
      () => {
        const a = rnd(10, 99), b = rnd(10, 99), c = rnd(10, 99);
        return { expr: `${a}+${b}+${c}`, op1:"加", op2:"加", ans: String(a + b + c) };
      },
      /* 10) a × b × c  连乘，先乘后乘 */
      () => {
        const a = rnd(2, 9), b = rnd(2, 9), c = rnd(2, 9);
        return { expr: `${a}×${b}×${c}`, op1:"乘", op2:"乘", ans: String(a * b * c) };
      },
      /* 11) a ÷ b ÷ c  连除（整除），先除后除
            构造 a = b × c × q，保证 a÷b = c×q、再 ÷c = q，两步都整除 */
      () => {
        for (;;){
          const b = rnd(2, 9), c = rnd(2, 9), q = rnd(2, 9);
          const a = b * c * q;
          if (a <= 999)
            return { expr: `${a}÷${b}÷${c}`, op1:"除", op2:"除", ans: String(q) };
        }
      }
    ];

    const m = MODES[rnd(0, MODES.length - 1)]();
    return {
      num: 8,
      text: `计算${m.expr}时,应先算（）法,再算（）法，结果是（）。`,
      ans: [m.op1, m.op2, m.ans]
    };
  }

  /* 第 9 题：五道乘法算式的积的特征分类，每次随机生成
     算式为两/三位数 × 一位数（或交换因数位置）；保证至少一道积末位有 0、
     至少一道积中间有 0，答案按①②③④⑤填出两个类别 */
  function makeWordFill9(){
    const CIRCLED = ["①", "②", "③", "④", "⑤"];
    const makeOne = pred => {
      for (let t = 0; t < 2000; t++){
        const b = rnd(2, 9);
        const a = Math.random() < 0.5 ? rnd(10, 99) : rnd(100, 999);
        const s = String(a * b);
        const midZero = s.slice(0, -1).includes("0");   /* 末尾以外还有 0 */
        const endZero = s.endsWith("0");                 /* 末位是 0 */
        if (!pred({ midZero, endZero })) continue;
        const expr = Math.random() < 0.5 ? `${b}×${a}` : `${a}×${b}`;
        return { expr, midZero, endZero };
      }
      return null;
    };
    let list = null;
    for (let t = 0; t < 200; t++){
      list = CIRCLED.map(() => makeOne(() => true));
      if (new Set(list.map(x => x.expr)).size !== 5) continue;
      if (!list.some(x => x.endZero) || !list.some(x => x.midZero)) continue;
      break;
    }
    /* 极端情况兜底：分别补齐缺的类别 */
    if (!list.some(x => x.endZero)){
      const fixed = makeOne(x => x.endZero);
      if (fixed) list[0] = fixed;
    }
    if (!list.some(x => x.midZero)){
      const fixed = makeOne(x => x.midZero);
      if (fixed) list[1] = fixed;
    }
    const pick = flag => list.map((x, i) => x[flag] ? CIRCLED[i] : "").join("");
    return {
      num: 9,
      text: `将算式${list.map((x, i) => CIRCLED[i] + x.expr).join(" ")}填在合适的横线上。积中间有0：（） 积的末尾有0：（）`,
      ans: [pick("midZero"), pick("endZero")]
    };
  }

  /* 第 10 题：先求总数，再按「总数÷每份数=份数」求份数，每次随机生成
     总数由男、女生人数相加得到，括号内逐空体现总人数 → 组数 → 数量关系式 → 综合算式 */
  function makeWordFill10(){
    let x, y, z, t, q;
    for (;;){
      z = rnd(3, 9);                  /* 每份数：每组人数 */
      q = rnd(2, 9);                  /* 份数：组数 */
      t = z * q;                      /* 总数：总人数 */
      if (t < 20 || t > 60) continue;
      x = rnd(8, t - 8);
      y = t - x;
      if (y < 8) continue;
      break;
    }
    return {
      num: 10,
      text: `学校体育社团有男生${x}人，女生${y}人，每${z}人分成一个小组，可以分成多少个小组?${x}+${y}=${t}(人)求的是（），${t}÷${z}=${q}(个)求的是（），这里的数量关系式是 总数÷每份数=（），列综合算式是（）。`,
      ans: ["总人数", "组数", "份数", `(${x}+${y})÷${z}`]
    };
  }

  /* 题干 → 渲染用的 { segs, ans, num, img, table, textAfter }；
     普通空位用 null 表示，圆圈空位用 { circle: true }，方框空位用 { box: true }。
     题目带 circleBlank / boxBlank 标记时，○/◯ 或 □ 也当空位，
     但「在○里填」「在□里填」这类说明里的圆圈/方框保留为普通文字 */
  function blankRe(circle, box, under){
    let src = "（\\s*）|\\(\\s*\\)";
    if (circle) src += "|[○◯](?![ 　]*[里中内])";
    if (box) src += "|□(?![ 　]*[里中内])";
    /* 括号答题空位 [[b]] / [[b12]]（也兼容 [[空5]]）同样是空位，算 1 个空 */
    src += "|\\[\\[(?:b|空)\\d{0,2}\\]\\]";
    /* 填空题里用固定横线 [[_8]] 当答题空位时，也各算 1 个空 */
    if (under) src += "|\\[\\[_\\d{1,2}\\]\\]";
    return new RegExp(src, "g");
  }
  /* 「在（）里填」「在（）中填」里的括号是说明文字，不是答题空位。
     只认紧跟在「在」后面的括号，「图（ ）中」「（ ）里最大能填几」仍是正常空位。 */
  function isInstrParen(src, index, len){
    const before = String(src || "").slice(0, index);
    const after = String(src || "").slice(index + len);
    return /在[ 　]*$/.test(before) && /^[ 　]*[里中内]/.test(after);
  }
  /* 逐个列出空位并标记是否为说明括号，答案计数/旧数据兼容都用它 */
  function blankMatches(text, circle, box, under){
    const src = String(text || "");
    const re = blankRe(circle, box, under);
    const out = [];
    let m;
    while ((m = re.exec(src)) !== null){
      const isCircle = /[○◯]/.test(m[0]);
      const isBox = /□/.test(m[0]);
      const isB = /^\[\[(?:b|空)\d{0,2}\]\]$/i.test(m[0]);
      const isU = /^\[\[_\d{1,2}\]\]$/.test(m[0]);
      out.push({ circle: isCircle, box: isBox, b: isB, u: isU, instr: !isCircle && !isBox && !isB && !isU && isInstrParen(src, m.index, m[0].length) });
    }
    return out;
  }
  function countBlanks(text, circle, box, under){
    return blankMatches(text, circle, box, under).filter(function(x){ return !x.instr; }).length;
  }
  function makeFillSegs(text, circle, box, under){
    const src = String(text || "");
    const re = blankRe(circle, box, under);
    const segs = [];
    let last = 0, m;
    while ((m = re.exec(src))){
      const tok = m[0];
      /* 说明括号不当作空位；不更新 last，让它留在后面的文字段里 */
      if (!/[○◯□]/.test(tok) && !/^\[\[(?:b|空)\d{0,2}\]\]$/i.test(tok) && !/^\[\[_\d{1,2}\]\]$/.test(tok) && isInstrParen(src, m.index, tok.length)) continue;
      if (m.index > last) segs.push(src.slice(last, m.index));
      const bm = /^\[\[(?:b|空)(\d{0,2})\]\]$/i.exec(tok);
      const um = /^\[\[_(\d{1,2})\]\]$/.exec(tok);
      segs.push(/[○◯]/.test(tok) ? { circle: true }
        : /□/.test(tok) ? { box: true }
        : bm ? { b: bm[1] ? Math.max(1, Math.min(20, parseInt(bm[1], 10))) : 3 }
        : um ? { u: Math.max(1, Math.min(40, parseInt(um[1], 10))) }
        : null);
      last = re.lastIndex;
    }
    if (last < src.length) segs.push(src.slice(last));
    if (!segs.length) segs.push("");
    return segs;
  }
  /* 表格单元格里的空位：括号、[[b]]、[[_N]]，以及 ◯/○、□。
     表格里的圆圈不依赖“○ 空位”，按答题空位处理（如“102×6◯600”填比较符号） */
  function countTableBlanks(rows, box, under){
    let n = 0;
    (rows || []).forEach(function(row){
      (row || []).forEach(function(cell){
        n += blankMatches(cell, true, box, under).filter(function(x){ return !x.instr; }).length;
      });
    });
    return n;
  }
  function matrixHasContent(m){
    return Array.isArray(m) && m.some(function(r){
      return Array.isArray(r) && r.some(function(v){ return String(v == null ? "" : v).trim(); });
    });
  }
  /* 把一批答案按顺序填进表格单元格；◯ 显示为“◯答案”，括号显示为“（答案）” */
  function fillTableWithAnswers(rows, vals, box, under){
    let vi = 0;
    const out = (rows || []).map(function(row){
      return (row || []).map(function(cell){
        const src = String(cell == null ? "" : cell);
        const re = blankRe(true, box, under);
        return src.replace(re, function(m, offset){
          if (vi >= vals.length) return m;
          const isCircle = /[○◯]/.test(m);
          const isBox = /□/.test(m);
          const isB = /^\[\[(?:b|空)\d{0,2}\]\]$/i.test(m);
          const isU = /^\[\[_\d{1,2}\]\]$/.test(m);
          if (!isCircle && !isBox && !isB && !isU && isInstrParen(src, offset, m.length)) return m;
          const v = String(vals[vi] == null ? "" : vals[vi]);
          vi++;
          /* 圆圈答案用标记包起来，渲染时压进 ○ 内 */
          if (isCircle) return "[[○" + v + "]]";
          if (isBox) return "□" + v;
          return "（" + v + "）";
        });
      });
    });
    return { rows: out, used: vi };
  }

  function toFillItem(item){
    const circle = !!item.circleBlank;
    const box = !!item.boxBlank;
    const rawAns = Array.isArray(item.ans) ? item.ans : (item.ans ? [item.ans] : []);
    let ans = rawAns.map(String);
    /* 后台勾选「暂不录入答案」的题：ans 为空（或全是空串），按空位数量补空串，
       保证题目本身照常显示，只是“显示答案”时没有红色答案 */
    if (!ans.some(s => s.trim())) ans = [];
    const segs = makeFillSegs(item.text, circle, box, true);
    const blanksInSegs = segs.filter(s => s === null || !!(s && (s.circle || s.box || s.b || s.u))).length;
    const afterBlanks = countBlanks(item.textAfter, circle, box, true);
    const textBlanks = blanksInSegs + afterBlanks;
    /* 表格里的空位也可以直接由 ans 提供答案（老师把 6 个答案一起填在答案框里） */
    const tableBlanks = item.table ? countTableBlanks(item.table, box, true) : 0;
    const hasTableAnswers = matrixHasContent(item.tableAns);
    /* 兼容旧题库：早期版本把「在（）里填」说明里的括号也算了一格答案 */
    if (textBlanks !== ans.length && !circle && !box){
      const flags = blankMatches(item.text, circle, box, true).concat(blankMatches(item.textAfter, circle, box, true));
      if (ans.length === flags.length){
        const kept = ans.filter((_, i) => !flags[i].instr);
        if (kept.length === textBlanks) ans = kept;
      }
    }
    /* 无括号填空（空位画在题目图片里）：答案框里的答案没有对应位置，
       改为显示在题目下方，避免题目因空位数不匹配而消失 */
    const solList = Array.isArray(item.sol) ? item.sol.slice() : (item.sol ? [item.sol] : []);
    if (textBlanks === 0 && tableBlanks === 0 && ans.length){
      const extra = ans.filter(function(s){ return String(s == null ? "" : s).trim(); });
      if (extra.length) solList.push("答案：" + extra.join("；"));
      ans = [];
    }
    /* 表格答案有两种存法：tableAns（表格答案行）或直接排在 ans 里。
       没填 tableAns 时，允许 ans 的空位数 = 题干空位 + 表格空位 */
    const maxBlanks = textBlanks + (hasTableAnswers ? 0 : tableBlanks);
    const tableAnsFromAns = !hasTableAnswers && tableBlanks > 0 &&
      ans.length === maxBlanks && maxBlanks > textBlanks;
    /* 暂未录入答案：题照常渲染，空位答案先留空，之后在后台补录 */
    if (!ans.length && textBlanks > 0) ans = new Array(textBlanks).fill("");
    if (ans.length !== textBlanks && !tableAnsFromAns) return null;   /* 空位数与答案数不符 */
    const imgInfo = imgListOf(item);
    const ansImgs = Array.isArray(item.ansImg) ? item.ansImg : (item.ansImg ? [item.ansImg] : []);
    return { segs, ans, circleBlank: circle, boxBlank: box, num: item.num, img: imgInfo.img, imgs: imgInfo.imgs, imgPos: imgInfo.imgPos, imgW: imgInfo.imgW, imgPosList: imgInfo.imgPosList, imgWList: imgInfo.imgWList, imgAlignList: imgInfo.imgAlignList, table: item.table, tableAns: item.tableAns, tableStyle: item.tableStyle, tableAlign: item.tableAlign, textAfter: item.textAfter, tag: item.tag,
      tableBlanks: tableBlanks, tableAnsFromAns: tableAnsFromAns,
      sol: solList, ansImg: ansImgs };
  }

  function readImported(){
    try { return JSON.parse(localStorage.getItem(BANK_KEY)) || []; } catch (e) { return []; }
  }

  /* 模板页：固定只渲染导入题库里的题，内置题（生成器/内置题库）一律不渲染。
     没有导入题的板块（含大类标题、小题标题）会自动收起；
     需要临时查看内置题时，在网址后加 ?builtin=1。 */
  const HIDE_BUILTIN_KEY = "xhHideBuiltin_v1";
  function hideBuiltinOn(){
    try {
      const q = new URLSearchParams(location.search);
      if (q.get("builtin") === "1") return false;
    } catch (e) {}
    return true;
  }

  /* ================= 出题范围（视图层，不改题库、不改标签） =================
     配置存在 localStorage["xhViewConfig_template_v1"]：
       { version:1, active:true, slots:{ "1-1":true, "1-2":false, ... } }
     · 模板页默认「全部应用」：没有配置时显示全部导入题，忽略 9xxxx 控制标签
     · 板块和题量只按导入标签统计，内置题按已删除处理
     · 启用后以勾选为准：某个大类一组都没勾 → 连大类标题一起隐藏
     · 面板里的「恢复默认」会删除配置，重新应用全部导入题目 */
  const VIEW_KEY = "xhViewConfig_template_v1";   /* 模板页独立，避免与作业页的出题范围互相影响 */
  const VIEW_CLASS_TITLES = {
    "1": "一、计算题", "2": "二、填空", "3": "三、选择题",
    "4": "四、操作题", "5": "五、解决问题"
  };
  const VIEW_SLOT_LABELS = {
    "1-1": "1.直接写出得数", "1-2": "2.用竖式计算",
    "1-3": "3.递等式计算", "1-4": "4.算一算，比一比",
    "2-1": "1.在（）里填合适的数或单位"
  };

  function readViewConfig(){
    try {
      const v = JSON.parse(localStorage.getItem(VIEW_KEY) || "null");
      return (v && typeof v === "object") ? v : null;
    } catch (e) { return null; }
  }
  function writeViewConfig(v){
    try { localStorage.setItem(VIEW_KEY, JSON.stringify(v)); } catch (e) {}
  }
  function clearViewConfig(){
    try { localStorage.removeItem(VIEW_KEY); } catch (e) {}
  }

  /* 当前生效的显隐状态：模板页默认「全部应用」，没有手动范围时不使用 9xxxx 标签隐藏板块 */
  function resolveViewState(imported){
    const cfg = readViewConfig();
    if (!(cfg && cfg.active && cfg.slots)) return { hiddenClass: new Set(), hiddenSlot: new Set() };
    const hiddenClass = new Set();
    const hiddenSlot = new Set();
    ["1", "2", "3", "4", "5"].forEach(a => {
      const slots = viewSlots(a, imported);
      let any = false;
      slots.forEach(s => {
        const key = a + "-" + s;
        if (cfg.slots[key] === true) any = true;
        else hiddenSlot.add(key);
      });
      if (!slots.length || !any) hiddenClass.add(a);
    });
    return { hiddenClass, hiddenSlot };
  }

  /* 某大类下可勾选的 slot：模板页只看导入标签，不再补内置默认题组 */
  function viewSlots(a, imported){
    const set = new Set();
    const re = new RegExp("^" + a + "(\\d{2})(\\d{2})$");
    (imported || []).forEach(it => {
      if (!it || !it.text) return;   /* 占位符不算题 */
      (it.tags || []).forEach(t => {
        const m = re.exec(t);
        if (m && parseInt(m[2], 10) > 0) set.add(parseInt(m[1], 10));
      });
    });
    return [...set].filter(s => s > 0).sort((x, y) => x - y);
  }

  /* 某 slot 的题量：模板页只统计导入题，内置题按已删除处理 */
  function viewSlotCount(a, s, imported){
    const pad = n => String(n).padStart(2, "0");
    const ids = new Set();
    const re = new RegExp("^" + a + pad(s) + "(\\d{2})$");
    imported.forEach(it => {
      if (!it || !it.text) return;   /* 占位符不算题 */
      (it.tags || []).forEach(t => {
        const m = re.exec(t);
        if (m && parseInt(m[1], 10) > 0) ids.add(parseInt(m[1], 10));
      });
    });
    return ids.size;
  }

  /* 图片位置约定：imgPos 取 top / bottom / left / right；
     图片字段也支持前缀写法：上:图片、下:、左:、右:（或 top:/bottom:/left:/right:） */
  const IMG_POS_ALIAS = {
    "上": "top", "下": "bottom", "左": "left", "右": "right",
    "top": "top", "bottom": "bottom", "left": "left", "right": "right"
  };
  function normImgPos(v){
    const s = String(v || "").trim().toLowerCase();
    return IMG_POS_ALIAS[s] || "";
  }
  /* 图片宽度：20~1000px；留空表示按题型默认。
     图片字段也支持在末尾写 @宽度（也兼容 |宽度），如 img/q.png@240、左:img/q.png@240 */
  function normImgW(v){
    const m = /^(\d{1,4})(?:\s*(?:px|像素))?$/i.exec(String(v == null ? "" : v).trim());
    if (!m) return "";
    const n = parseInt(m[1], 10);
    return n >= 20 && n <= 1000 ? n : "";
  }
  /* 图片自身水平对齐：left / center / right（空 = 默认） */
  function normImgAlign(v){
    const s = String(v == null ? "" : v).trim().toLowerCase();
    if (s === "left" || s === "左" || s === "左对齐") return "left";
    if (s === "right" || s === "右" || s === "右对齐") return "right";
    if (s === "center" || s === "中" || s === "居中") return "center";
    return "";
  }
  function parseImgSpec(raw){
    let s = String(raw || "").trim();
    /* 末尾可写对齐方式：左对齐 / 居中 / 右对齐（或 left / center / right） */
    let imgAlign = "";
    const am = /^(.*?)\s+(左对齐|居中|右对齐|left|center|right)\s*$/i.exec(s);
    if (am && am[1].trim()){ s = am[1].trim(); imgAlign = normImgAlign(am[2]); }
    const m = /^(上|下|左|右|top|bottom|left|right)\s*[:：]\s*(.*)$/i.exec(s);
    let imgPos = "";
    if (m){ imgPos = normImgPos(m[1]); s = m[2].trim(); }
    let imgW = "";
    const w = /^(.*?)\s*[|｜@]\s*(\d{1,4})(?:\s*(?:px|像素))?\s*$/i.exec(s);
    if (w && w[1].trim()){ s = w[1].trim(); imgW = normImgW(w[2]); }
    return { img: s, imgPos: imgPos, imgW: imgW, imgAlign: imgAlign };
  }
  /* 一题的图片列表：imgs（多图）优先，兼容旧 img 单图；rawIndex 用于对齐 imgAfterSub */
  function itemImgSpecs(it){
    const raw = (it && Array.isArray(it.imgs) && it.imgs.length) ? it.imgs : (it && it.img ? [it.img] : []);
    const out = [];
    raw.forEach(function(x, i){
      const s = parseImgSpec(x);
      if (s.img) out.push({ img: s.img, imgPos: s.imgPos, imgW: s.imgW, imgAlign: s.imgAlign, rawIndex: i });
    });
    return out;
  }
  /* 汇总成渲染用字段：imgs 全部图片，img 第一张；位置/宽度取显式设置，其次取图片行内写法；
     imgAfterSub 与 imgs 一一对应：0=题干，N=第 N 条小题后 */
  function imgListOf(it){
    const specs = itemImgSpecs(it);
    const pos = normImgPos(it && it.imgPos), w = normImgW(it && it.imgW);
    const align = normImgAlign(it && it.imgAlign);
    const after = specs.map(function(s){
      const v = (it && Array.isArray(it.imgAfterSub)) ? parseInt(it.imgAfterSub[s.rawIndex], 10) : 0;
      return Math.max(0, v || 0);
    });
    return {
      imgs: specs.map(function(s){ return s.img; }),
      img: specs.length ? specs[0].img : "",
      imgPos: pos,
      imgW: w,
      imgAlign: align,
      /* 每张图自己的位置/宽度/对齐；未单独设置时沿用题目级的默认值 */
      imgPosList: specs.map(function(s){ return s.imgPos || pos || ""; }),
      imgWList: specs.map(function(s){ return s.imgW || w || ""; }),
      imgAlignList: specs.map(function(s){ return s.imgAlign || align || ""; }),
      imgAfterSub: after
    };
  }
  /* 把自定义宽度应用到题目图片；未指定宽度时不改动，沿用各题型的默认 CSS */
  function applyImgWidth(img, w){
    const n = normImgW(w);
    if (!n) return false;
    img.style.width = n + "px";
    img.style.maxWidth = "calc(100% - 24px)";
    return true;
  }

  /* 对 bank.json / CSV 导入的条目做归一化：从 5 位标签自动补 isTitle / isPlaceholder / isControl，
     这样 JSON 里只需要写 text / tags / ans，不用手动加这些内部标记 */
  function normalizeItem(it){
    if (!it || typeof it !== "object") return it;
    const numTag = (it.tags || []).find(t => /^\d{5}$/.test(t)) || "";
    if (numTag && numTag.endsWith("00") && it.text) it.isTitle = true;
    if (!it.text && (it.tags || []).some(t => /^\d{5}$/.test(t) && !t.endsWith("00"))) it.isPlaceholder = true;
    const ctrlTags = (it.tags || []).filter(t => /^9\d{4}$/.test(t));
    if (ctrlTags.length) it.isControl = true;
    if (it.img){
      const spec = parseImgSpec(it.img);
      it.img = spec.img;
      if (spec.imgPos && !it.imgPos) it.imgPos = spec.imgPos;
      if (spec.imgW && !it.imgW) it.imgW = spec.imgW;
      if (spec.imgAlign && !it.imgAlign) it.imgAlign = spec.imgAlign;
    }
    /* 多图：imgs 数组（每张一条）；img 始终保留第一张，兼容旧逻辑。
       同一张图片可能被重复引用（如操作题的 3 个竖式模板），不能按地址去重 */
    if (Array.isArray(it.imgs)){
      const list = [], after = [];
      it.imgs.forEach(function(x, i){
        if (typeof x !== "string" || !x.trim()) return;
        const spec = parseImgSpec(x);
        if (!spec.img) return;
        /* 保留每张图自己的「位置:…@宽度」写法 */
        list.push(x.trim());
        const n = Array.isArray(it.imgAfterSub) ? parseInt(it.imgAfterSub[i], 10) : 0;
        after.push(Math.max(0, n || 0));
      });
      if (list.length){
        it.imgs = list;
        it.img = parseImgSpec(list[0]).img;
        if (after.some(function(n){ return n > 0; })) it.imgAfterSub = after;
        else delete it.imgAfterSub;
      } else {
        delete it.imgs;
        delete it.imgAfterSub;
      }
    } else if (it.imgAfterSub){
      if (Array.isArray(it.imgAfterSub)){
        it.imgAfterSub = it.imgAfterSub.map(function(x){ return Math.max(0, parseInt(x, 10) || 0); });
        if (!it.imgAfterSub.some(function(n){ return n > 0; })) delete it.imgAfterSub;
      } else delete it.imgAfterSub;
    }
    if (it.imgPos){
      const p = normImgPos(it.imgPos);
      if (p) it.imgPos = p; else delete it.imgPos;
    }
    if (it.imgW){
      const w = normImgW(it.imgW);
      if (w) it.imgW = w; else delete it.imgW;
    }
    if (it.imgAlign){
      const a = normImgAlign(it.imgAlign);
      if (a) it.imgAlign = a; else delete it.imgAlign;
    }
    return it;
  }

  /* 内置 + 已导入，按题干去重，并按 ENABLED_TAGS 过滤 */
  function bankItems(){
    const seen = new Set(), out = [];
    [...BUILTIN_BANK, ...readImported()].forEach(it => {
      if (!it || !it.text || seen.has(it.text)) return;
      if (ENABLED_TAGS.length && !(it.tags || []).some(t => ENABLED_TAGS.includes(t))) return;
      seen.add(it.text);
      out.push(it);
    });
    return out;
  }

  /* 导入解析。列格式：
     题干 | 答案 | 标签 | 图片 | （旧位置列，已废弃，留空即可） | 选项 | 解题过程
     · 标签统一为 5 位数字：大类 1 位 + slot 2 位 + 序号 2 位
       - 大类：1=计算、2=填空、3=选择、4=操作、5=解决、0=卷首标题
       - slot：板块下的独立小标题（如计算下 01=口算,02=竖式,03=递等式,04=算一算比一比；填空下 01=第1题,02=第2题；选择/操作/解决下 01=第1题）
       - 序号：该 slot 下的第几道题；末两位为 00 表示该 slot 的标题（题干=题面说明）
       例：10105=口算第5题；20104=填空第1题第4小题；30102=选择第1题第2小题；40100=操作题第1题的标题；50100=解决问题第1题的标题
     · 标签末尾两位为 00（00000 / 10100 / 20100 / 30000 / 40000 / 50000 等）= 题目题面说明，跳过 ans / （）校验，
       渲染时替换对应的 section-title / 大题说明文本 */
  function parseBank(text){
    const items = [], errors = [];
    text.replace(/^\uFEFF/, "").split(/\r?\n/).forEach((raw, i) => {
      const line = raw.trim();
      if (!line) return;
      /* 跳过分隔线 ====、----、注释行 /* ... *\/、// 开头 */
      if (/^[=-]+$/.test(line)) return;
      if (/^\/\*.*\*\/$/.test(line)) return;
      if (/^\/\//.test(line)) return;
      if (/^(题干|题目|text)/i.test(line)) return;              /* 跳过表头 */
      const hasSep = line.includes("|") || line.includes(",");
      /* 没有任何列分隔符、且不含 5 位数字标签 → 当作说明文字跳过 */
      if (!hasSep && !/\d{5}/.test(line)) return;
      const f = splitFields(line);
      const rawAns = (f[1] || "").split(/[;；、]/).map(s => s.trim()).filter(Boolean);
      const rawTags = (f[2] || "").split(/[,，;；、\s]+/).filter(Boolean);
      /* 标签范围展开：10101-10115 → 10101,10102,...,10115，方便一次写「口算出 15 道随机题」。
         约束：范围两端前三位（大类+slot）必须相同，否则视为跨板块笔误（如 00000-10115），
         直接报错忽略，避免展开出成千上万无意义标签撑爆存储。 */
      const tags = [];
      let rangeError = "";
      rawTags.forEach(t => {
        const r = /^(\d{5})-(\d{5})$/.exec(t);
        if (r){
          if (r[1].slice(0, 3) !== r[2].slice(0, 3)){
            rangeError = `标签范围 ${t} 跨板块（前三位必须相同，如 10101-10115）`;
            return;
          }
          const a = parseInt(r[1]), b = parseInt(r[2]);
          const step = a <= b ? 1 : -1;
          for (let n = a; n !== b + step; n += step) tags.push(String(n).padStart(5, "0"));
        } else {
          tags.push(t);
        }
      });
      if (rangeError){ errors.push(`第 ${i + 1} 行：${rangeError}`); return; }
      /* 控制标签 9xxxx：只用来开关板块，不生成题目。
         90000 = 只显示本次导入过的板块；9A000 = 隐藏指定大类（A：1计算 2填空 3选择 4操作 5解决） */
      const ctrlTags = tags.filter(t => /^9\d{4}$/.test(t));
      if (ctrlTags.length){
        items.push({ text: "", tags: ctrlTags, isControl: true });
        const rest = tags.filter(t => !/^9\d{4}$/.test(t));
        tags.length = 0;
        rest.forEach(t => tags.push(t));
        if (!tags.length) return;
      }
      const numTag = tags.find(t => /^\d{5}$/.test(t)) || "";
      const isTitle = numTag && numTag.endsWith("00");          /* 末尾两位 00 = 题目说明 */
      const kind = numTag ? numTag[0] : "";
      /* 括号统一成全角（），并去掉空位里的空格，兼容 Word/Excel 里敲成 () 或 （ ） 的情况 */
      const q = (f[0] || "").trim().replace(/[（(]\s*[)）]/g, "（）");
      /* 题干为空：若标签里存在任意非标题的 5 位数字题号（即不是 xx00），视为「仅计数占位符」——
         保留题号用于数量计算，不参与渲染，对应题号自动回退到随机生成器。
         例：「| | 10101」口算第 1 题随机；「| | 10101-10115」一次占 15 道；
         误写「10100-10115」也能容错——展开里有 10101~10115 这些题号，仍当占位符，
         其中 10100 标题标签会被剔除，避免误盖题面标题。 */
      if (!q){
        const nonTitleTag = tags.find(t => /^\d{5}$/.test(t) && !t.endsWith("00"));
        if (nonTitleTag){
          const cleanTags = tags.filter(t => !(/^\d{5}$/.test(t) && t.endsWith("00")));
          items.push({ text: "", tags: cleanTags, isPlaceholder: true });
          return;
        }
        errors.push(`第 ${i + 1} 行：题干为空`);
        return;
      }
      const imgSpec = parseImgSpec((f[3] || "").trim());
      const pos = (f[4] || "").trim();
      const options = (f[5] || "").split(/[\/／]/).map(s => s.trim()).filter(Boolean);
      const solText = (f[6] || "").trim();

      const item = { text: q, tags };
      if (isTitle){ item.isTitle = true; }
      if (imgSpec.img) item.img = imgSpec.img;
      if (imgSpec.img && imgSpec.imgPos) item.imgPos = imgSpec.imgPos;
      if (imgSpec.img && imgSpec.imgW) item.imgW = imgSpec.imgW;
      if (pos) item.pos = pos;
      if (options.length) item.options = options;
      /* 选择题没有文字选项、但配了图：整张图就是选项，不再补 A/B/C/D */
      else if (!isTitle && kind === "3" && imgSpec.img) item.optionsInImg = true;
      if (solText) item.sol = solText.split(/[;；]/).map(s => s.trim()).filter(Boolean);

      if (isTitle){
        /* 题目说明条目，不要求答案、不要求（），只保留 text / tag */
      } else if (kind === "1"){
        if (!rawAns.length){ errors.push(`第 ${i + 1} 行：缺少答案`); return; }
        item.ans = rawAns[0];
      } else if (kind === "3"){
        const need = countBlanks(q, false);
        if (!rawAns.length){ errors.push(`第 ${i + 1} 行：缺少答案`); return; }
        if (need !== rawAns.length){ errors.push(`第 ${i + 1} 行：${need} 个空却有 ${rawAns.length} 个答案`); return; }
        item.ans = rawAns;
      } else if (kind === "4" || kind === "5"){
        item.ans = rawAns;
        if (!item.sol && rawAns.length) item.sol = rawAns;
      } else {
        /* 填空题：必须有 5 位数字标签，否则退化为中文标签自动匹配（填空第 1 题） */
        const hasBlankSyntax = q.includes("（）") || /\[\[(?:b|空)\d{0,2}\]\]/i.test(q) || /\[\[_\d{1,2}\]\]/.test(q);
        if (!numTag){
          /* 填空第 1 题的中文标签条目，允许无（）兜底由 makeFillByTag 随机生成，直接 push */
          if (!hasBlankSyntax){ item.ans = rawAns; items.push(item); return; }
        }
        if (!hasBlankSyntax){ errors.push(`第 ${i + 1} 行：题干里没有（）/[[b]]/[[_8]] 这类空位`); return; }
        const need = countBlanks(q, false, false, true);
        if (rawAns.length !== need){ errors.push(`第 ${i + 1} 行：${need} 个空却有 ${rawAns.length} 个答案`); return; }
        item.ans = rawAns;
      }

      /* 写数字标签（5 位数）的题不再按单位自动补中文标签，避免被填空第 1 题的中文标签抽取池误抓；
         没写数字标签时（填空第 1 题用中文标签的场景）保持原来的自动补标签 */
      if (!numTag && !tags.includes("质量") && !tags.includes("长度") && !tags.includes("时间")){
        if (/吨|千克|克/.test(q)) tags.unshift("质量");
        else if (/千米|米|分米|厘米|毫米/.test(q)) tags.unshift("长度");
        else if (/时|分|秒/.test(q)) tags.unshift("时间");
      }
      items.push(item);
    });
    return { items, errors };
  }

  function splitFields(line){
    if (line.includes("|")) return line.split("|").map(s => s.trim().replace(/^"|"$/g, ""));
    const out = []; let cur = "", quoted = false;
    for (const ch of line){
      if (ch === '"'){ quoted = !quoted; continue; }
      if (ch === "," && !quoted){ out.push(cur); cur = ""; continue; }
      cur += ch;
    }
    out.push(cur);
    return out.map(s => s.trim());
  }

  function saveImported(items){
    /* 去重键用「首个 5 位数字标签 + 题干」：让同一道口算题能在不同题号下各存一条 */
    const keyOf = it => {
      const t = (it.tags || []).find(x => /^\d{5}$/.test(x)) || "";
      return t + "|" + it.text;
    };
    const map = new Map(readImported().map(it => [keyOf(it), it]));
    items.forEach(it => map.set(keyOf(it), normalizeItem(it)));
    try { localStorage.setItem(BANK_KEY, JSON.stringify([...map.values()])); } catch (e) {}
    return map.size;
  }

  /* 填空第 1 题（slot 01）的默认生成器：无导入标签时用这三种单位题，数量默认为 3；
     有导入标签 201XX 时取最大序号为题量，超过 3 题则循环复用生成器。
     kind 枚举：mass/len/time，与 UNIT_TABLE 对应。 */
  const FILL01_KINDS = ["mass", "len", "time"];

  function makeFill01Item(idx, tag){
    const kind = FILL01_KINDS[idx % FILL01_KINDS.length];
    return { ...makeFillProblem(kind), tag };
  }

  /* 填空第 1 题也支持导入题库中用中文标签「质量 / 长度 / 时间」分类的题目；
     没有写 5 位题号的中文标签题会进入对应小题的随机池。 */
  const FILL01_TAGS = ["质量", "长度", "时间"];
  function makeFillByTag(idx){
    const wanted = FILL01_TAGS[idx % FILL01_TAGS.length];
    const pool = readImported().filter(it =>
      it && it.text && !it.isPlaceholder && (it.tags || []).includes(wanted));
    return pool.length ? pool[rnd(0, pool.length - 1)] : null;
  }

  /* ---------- 导入题库通用取题：精确题号标签优先，其次整类池 ---------- */
  function importedByTag(tag){
    return readImported()
      .filter(it => it && it.text && !it.isPlaceholder && (it.tags || []).includes(tag))
      .filter(it => !ENABLED_TAGS.length || (it.tags || []).some(t => ENABLED_TAGS.includes(t)));
  }

  /* 精确替换：标签为某一道题的题号，如 1105 */
  function pickByTag(tag){
    const pool = importedByTag(tag);
    return pool.length ? pool[rnd(0, pool.length - 1)] : null;
  }

  /* 整类替换：标签为分类号，如 11 / 12 / 13。洗牌后按序发放，避免同一张卷子重复出题 */
  function classPool(clsTag){
    const pool = importedByTag(clsTag).slice();
    for (let i = pool.length - 1; i > 0; i--){
      const j = rnd(0, i);
      [pool[i], pool[j]] = [pool[j], pool[i]];
    }
    let p = 0;
    return () => (p < pool.length ? pool[p++] : null);
  }

  /* 题目题面说明：按末尾 00 结尾的标签（10100 / 20100 等）查询导入题库，
     找到则用导入 text 作为大题标题，没找到返回 fallback 默认值；多条则随机 */
  function pickTitle(tag, fallback){
    /* 不依赖 isTitle 标记：直接按「5 位标签、末两位 00」识别标题，
       这样从 JSON 直接载入、未经后台 normalizeItem 的题库也能显示题面说明 */
    const pool = readImported().filter(it => {
      if (!it || !it.text) return false;
      const numTag = (it.tags || []).find(t => /^\d{5}$/.test(t)) || "";
      return !!numTag && numTag.endsWith("00") && (it.tags || []).includes(tag);
    });
    if (!pool.length) return fallback;
    const t = pool[rnd(0, pool.length - 1)].text.trim();
    /* 如果导入的标题里没带句号，补一个；避免 HTML 里原有的「1.」等前缀被用户自己重复写 */
    return t;
  }

  /* 计算题（口算/竖式/递等式）：题干已含等号，答案是单个得数；
     也支持一张表格排版（item.table / tableAns），和填空题的表格字段一致 */
  function toCalcItem(it, tag){
    return {
      text: String(it.text), ans: Array.isArray(it.ans) ? it.ans.join("") : it.ans, tag,
      table: it.table, tableAns: it.tableAns, tableAlign: it.tableAlign,
      tables: it.tables, tableLayout: it.tableLayout,
      textAfter: it.textAfter
    };
  }

  /* 选择题：题号取标签末两位（314 → 14），行高/配图行数给默认值 */
  function toChoiceItem(it, num){
    const ansArr = Array.isArray(it.ans) ? it.ans : (it.ans ? [it.ans] : []);
    const imgInfo = imgListOf(it);
    const optionsInImg = !!it.optionsInImg;
    return {
      num, text: String(it.text), ans: ansArr.map(String),
      options: optionsInImg ? [] : ((it.options && it.options.length) ? it.options : ["A. ", "B. ", "C. ", "D. "]),
      optionsInImg: optionsInImg,
      tables: it.tables || (it.table ? [{ rows: it.table, ans: it.tableAns }] : []),
      tableLayout: it.tableLayout === "row" ? "row" : "",
      textAfter: it.textAfter || "",
      optionImgs: Array.isArray(it.optionImgs) ? it.optionImgs : [],
      img: imgInfo.img, imgs: imgInfo.imgs, imgPos: imgInfo.imgPos, imgW: imgInfo.imgW,
      imgPosList: imgInfo.imgPosList, imgWList: imgInfo.imgWList, imgAlignList: imgInfo.imgAlignList,
      n: it.n || 5, imgLines: it.imgLines || 4
    };
  }

  /* 解决问题：题号取标签末两位（419 → 19） */
  function toAppItem(it, num){
    const solArr = Array.isArray(it.sol) ? it.sol : (it.sol ? [it.sol] : []);
    /* 操作题 / 解决问题的「答案」字段：在显示答案时和解题过程一起显示 */
    const ansArr = Array.isArray(it.ans) ? it.ans : (it.ans ? [it.ans] : []);
    const imgInfo = imgListOf(it);
    return {
      num, text: String(it.text), ans: ansArr, sol: solArr, ansImg: it.ansImg, subs: it.subs || [],
      solTables: Array.isArray(it.solTables) ? it.solTables : [],
      solTableLayout: it.solTableLayout === "row" ? "row" : "",
      solTablesPlain: !!it.solTablesPlain,
      tables: it.tables || (it.table ? [{ rows: it.table, ans: it.tableAns }] : []),
      tableLayout: it.tableLayout === "row" ? "row" : "",
      textAfter: it.textAfter,
      img: imgInfo.img, imgs: imgInfo.imgs, imgPos: imgInfo.imgPos, imgW: imgInfo.imgW,
      imgPosList: imgInfo.imgPosList, imgWList: imgInfo.imgWList, imgAlignList: imgInfo.imgAlignList,
      imgAfterSub: imgInfo.imgAfterSub,
      imgWide: !!it.imgWide,
      n: it.n || 6, imgLines: it.imgLines || 4
    };
  }

  /* 填空题第 2~10 题：按标签 20201~21001 从导入题库取题；
     pad(n,2) 把题号补齐成两位，如 2→"02"、10→"10"；标签形如 "20201"、"21001" */
  function makeFillByNum(num){
    const tag = "2" + String(num).padStart(2, "0") + "01";
    const pool = importedByTag(tag).map(toFillItem).filter(Boolean);
    return pool.length ? pool[rnd(0, pool.length - 1)] : null;
  }

  /* 题干富文本约定：
     · [[br]]（不区分大小写）或真实换行 → <br>
     · [[文字]] → 加下划线的文字（题目要求划横线的内容）
     其余文字按 cls 包成 span（cls 为空时用文本节点） */
  const BR_SPLIT = /\r\n|\r|\n|\[\[br\]\]/i;
  /* [[_8]] = 8 个全角字宽的下划线；[[sp]] / [[sp3]] = 1 / 3 个全角空格；
     [[b]] / [[b5]]（也可写 [[空]] / [[空5]]）= 带括号的答题空位，默认 3 个全角字宽，可写 1~20 */
  const ULINE_LEN = /^_(\d{1,2})$/;
  const SPACE_LEN = /^sp(\d{0,2})$/i;
  const GAP_LEN = /^(?:b|空)(\d{0,2})$/i;
  function appendTextWithBreaks(container, text, cls){
    const addText = t => {
      if (!t) return;
      if (cls){
        const span = document.createElement("span");
        span.className = cls;
        span.textContent = t;
        container.appendChild(span);
      } else {
        container.appendChild(document.createTextNode(t));
      }
    };
    const addPlain = t => {
      String(t).split(BR_SPLIT).forEach((p, i) => {
        if (i > 0) container.appendChild(document.createElement("br"));
        addText(p);
      });
    };

    let rest = String(text == null ? "" : text);
    for (;;){
      const start = rest.indexOf("[[");
      const end = start < 0 ? -1 : rest.indexOf("]]", start + 2);
      if (end < 0){ addPlain(rest); break; }
      addPlain(rest.slice(0, start));
      const inner = rest.slice(start + 2, end);
      if (/^\s*br\s*$/i.test(inner)){
        container.appendChild(document.createElement("br"));
      } else if (ULINE_LEN.test(inner)){
        /* 固定长度横线：数字 1~40，单位是全角字宽 */
        const n = Math.max(1, Math.min(40, parseInt(inner.slice(1), 10)));
        const u = document.createElement("span");
        u.className = (cls ? cls + " " : "") + "uline uline-blank";
        u.textContent = "\u3000".repeat(n);
        container.appendChild(u);
      } else if (SPACE_LEN.test(inner)){
        /* 文字间距：[[sp]] 或 [[sp3]]，单位是全角空格 */
        const n = inner.length > 2
          ? Math.max(1, Math.min(40, parseInt(inner.slice(2), 10)))
          : 1;
        const gap = document.createElement("span");
        gap.className = "spacing";
        gap.textContent = "\u3000".repeat(n);
        container.appendChild(gap);
      } else if (GAP_LEN.test(inner)){
        /* \u62ec\u53f7\u7b54\u9898\u7a7a\u4f4d\uff1a[[b]] \u9ed8\u8ba4 3em\uff0c[[b5]] \u4e3a 5em\uff1b\u62ec\u53f7\u4e0e\u7a7a\u4f4d\u4f5c\u4e3a\u6574\u4f53\u4e0d\u62c6\u884c */
        const m = inner.match(GAP_LEN);
        const n = m[1] ? Math.max(1, Math.min(20, parseInt(m[1], 10))) : 3;
        const group = document.createElement("span");
        group.className = "blank";
        const open = document.createElement("span");
        open.className = "eq";
        open.textContent = "\uff08";
        const gap = document.createElement("span");
        gap.className = "gapblank";
        gap.style.minWidth = n + "em";
        const close = document.createElement("span");
        close.className = "eq";
        close.textContent = "\uff09";
        group.append(open, gap, close);
        container.appendChild(group);
      } else {
        const u = document.createElement("span");
        u.className = (cls ? cls + " " : "") + "uline";
        u.textContent = inner;
        container.appendChild(u);
      }
      rest = rest.slice(end + 2);
    }
  }

/* 辅助：向容器追加文字段与空位（括号 / 圆圈），返回当前答案索引 */
  function appendSegs(container, segs, ans, ai, num){
    segs.forEach((s, idx) => {
      if (s === null || (s && s.circle) || (s && s.box) || (s && s.b) || (s && s.u)){
        const isCircle = !!(s && s.circle);
        const isBox = !!(s && s.box);
        const isB = !!(s && s.b);
        const isU = !!(s && s.u);
        /* 空位与答案包在一起，避免换行时被拆到两行 */
        const group = document.createElement("span");
        group.className = "blank" + (isCircle ? " circle" : isBox ? " box" : "");

        if (isCircle || isBox){
          const glyph = document.createElement("span");
          glyph.className = "glyph";
          glyph.textContent = isCircle ? "○" : "□";
          group.appendChild(glyph);
        } else if (!isU){
          const open = document.createElement("span");
          open.className = "eq";
          open.textContent = "（";
          group.appendChild(open);
        }

        const a = document.createElement("span");
        a.className = "ans" + (isCircle ? " circle-ans" : isBox ? " box-ans" : isU ? " uline-ans" : "");
        if (isU) a.style.minWidth = s.u + "em";         /* [[_8]] 横线长度 */
        else if (isB) a.style.minWidth = s.b + "em";    /* [[b]] / [[b12]] 的书写宽度 */
        a.dataset.ans = ans[ai++] || "";
        a.textContent = showAnswer ? a.dataset.ans : "";
        group.appendChild(a);

        if (!isCircle && !isBox && !isU){
          const close = document.createElement("span");
          close.className = "eq";
          close.textContent = "）";
          group.appendChild(close);
        }

        container.appendChild(group);
      } else {
        /* 文字段：题首加题号；[[...]] 下划线、[[br]] 换行由 appendTextWithBreaks 处理 */
        appendTextWithBreaks(container, (idx === 0 && num ? num + ". " : "") + s, "eq");
      }
    });
    return ai;
  }

  /* 把含（）的题干拆成「文字段 + 空位」。
     复用 makeFillSegs 的空位正则，兼容导入题库里的「（　）」「( )」等写法，
     避免全角空格导致选择题找不到空位、显示答案时什么都不出现。 */
  function makeSegs(text){
    return makeFillSegs(text, false);
  }

  /* 图片加载：相对路径原样加载；只写文件名时自动到 img/ 与 .uploads/ 里找；
     全部失败则换成可见的「图片缺失」占位，避免打印时无声无息地少一张图 */
  function loadImg(img, src){
    const raw = String(src || "").trim();
    const base = raw.split(/[\\/]/).pop();
    const list = [raw];
    if (raw && !/^(data:|https?:|blob:|file:|\/)/i.test(raw) && !/[\\/]/.test(raw)){
      list.push("img/" + raw, ".uploads/" + raw);
    }
    let i = 0;
    img.onerror = () => {
      i += 1;
      if (i < list.length){ img.src = list[i]; return; }
      const ph = document.createElement("span");
      ph.className = "img-missing";
      ph.textContent = "图片缺失：" + base;
      img.replaceWith(ph);
    };
    img.src = list[0];
  }

  /* Word 导入的多行填空题：量出最宽一行的实际宽度，按可用宽度缩字号，
     避免一行里的两/三小题被挤到下一行。打印内容宽约 658px 作为上限。 */
  function fitFillCell(cell){
    const avail = Math.min(cell.clientWidth || 0, 658) - 6;
    if (!avail) return;
    const cs = getComputedStyle(cell);
    let fs = parseFloat(cs.fontSize) || 20;
    for (let pass = 0; pass < 3; pass++){
      const clone = cell.cloneNode(true);
      clone.style.cssText = "position:absolute;visibility:hidden;left:0;top:-9999px;display:block;" +
        "white-space:nowrap;width:auto;font-size:" + fs + "px;letter-spacing:" + cs.letterSpacing;
      cell.parentNode.appendChild(clone);
      const w = clone.getBoundingClientRect().width;
      clone.remove();
      if (!w || w <= avail) break;
      fs = Math.max(12, Math.floor(fs * avail / w * 0.99 * 2) / 2);
    }
    cell.style.fontSize = fs + "px";
  }

  /* 填空专用单元格：空（）处放答案占位，显示答案时红字填入括号内 */
  function makeFillCell(q){
    const cell = document.createElement("div");
    cell.className = "fillitem";
    /* 估算题面宽度（em）：汉字/全角 1em，半角 0.55em，每个空位连括号约 4em。
       超过半栏（约 18em）就跨两栏；只按字符数判断会让带空位的长题被 flex 挤成窄条。 */
    const fillEmWidth = (q.segs || []).reduce(function(w, s){
      if (typeof s !== "string") return w + ((s && (s.b || s.u)) || 4);   /* [[b12]] / [[_8]] 按实际字宽估算 */
      for (let i = 0; i < s.length; i++) w += s.charCodeAt(i) < 0x100 ? 0.55 : 1;
      return w;
    }, 0);
    if (fillEmWidth > 17.5) cell.classList.add("fill-long");

    /* 多行填空题（Word 里每行两/三小题）：插进页面后按实际可用宽度缩字号，
       保证一小题不被拆行。打印宽度约 658px，宽度取屏幕与打印的较小值。 */
    const multiLine = (q.segs || []).some(function(s){ return typeof s === "string" && /\[\[br\]\]/i.test(s); });
    if (multiLine){
      cell.classList.add("fill-long", "fill-dense");
      requestAnimationFrame(function(){ fitFillCell(cell); });
    }

    let ai = 0;

    const fillImgs = (q.imgs && q.imgs.length) ? q.imgs : (q.img ? [q.img] : []);
    if (fillImgs.length){
      /* 带图题：图片位置取第一张图的设置；每张图可用自己的宽度 */
      cell.classList.add("has-img");
      const fillPosList = q.imgPosList || [], fillWList = q.imgWList || [], fillAlignList = q.imgAlignList || [];
      const pos = normImgPos(fillPosList[0]) || normImgPos(q.imgPos);
      const fillAlign = fillAlignList[0] || "";
      /* 图片在上/下时，按第一张图的对齐方式把图片块靠左/居中/靠右 */
      const applyFillAlign = function(el){
        if (pos !== "top" && pos !== "bottom") return;
        if (fillAlign === "center"){ el.style.marginLeft = "auto"; el.style.marginRight = "auto"; }
        else if (fillAlign === "right"){ el.style.marginLeft = "auto"; }
      };
      const wrap = document.createElement("div");
      wrap.className = "q-with-img" + (pos ? " img-" + pos : "");
      const textPart = document.createElement("div");
      textPart.className = "q-text";
      ai = appendSegs(textPart, q.segs, q.ans, ai, q.num);

      if (fillImgs.length > 1){
        const group = document.createElement("div");
        group.className = "qimg-list";
        fillImgs.forEach(function(src, i){
          const im = document.createElement("img");
          im.alt = "";
          applyImgWidth(im, fillWList[i] || "");
          loadImg(im, src);
          group.appendChild(im);
        });
        applyFillAlign(group);
        if (pos === "left" || pos === "top") wrap.append(group, textPart);
        else wrap.append(textPart, group);
      } else {
        const img = document.createElement("img");
        img.alt = "";
        applyImgWidth(img, fillWList[0] || "");
        loadImg(img, fillImgs[0]);
        applyFillAlign(img);

        if (pos === "left" || pos === "top") wrap.append(img, textPart);
        else wrap.append(textPart, img);
      }

      cell.appendChild(wrap);
    } else {
      ai = appendSegs(cell, q.segs, q.ans, ai, q.num);
    }

    /* 带表格题：文字后插入表格，再渲染表格后的文字
       若提供 tableAns，则隐藏的单元格用 .table-ans 标记，显示答案时填充；
       没有 tableAns 时，把 ans 里排在题干答案之后的表格答案按顺序填进单元格 */
    if (q.table){
      let tableAns = q.tableAns;
      if (!tableAns && q.tableAnsFromAns && q.tableBlanks > 0){
        const filled = fillTableWithAnswers(q.table, q.ans.slice(ai, ai + q.tableBlanks), !!q.boxBlank, true);
        if (filled.used) tableAns = filled.rows;
      }
      const tbl = document.createElement("table");
      tbl.className = "fill-table" + (q.tableStyle === "plain" ? " plain" : "")
        + (q.tableAlign === "left" ? " align-left" : q.tableAlign === "right" ? " align-right" : "");
      q.table.forEach((row, r) => {
        const tr = document.createElement("tr");
        row.forEach((c, col) => {
          const td = document.createElement("td");
          appendTableCell(td, c);
          if (tableAns && tableAns[r] && tableAns[r][col] !== c){
            td.className = "table-ans";
            td.dataset.ans = tableAns[r][col];
            td.dataset.orig = c;   /* 隐藏答案时还原题目原文 */
            /* 重新渲染时如果正处于“显示答案”状态，直接显示答案，避免被刷新回题目原文 */
            if (showAnswer){
              td.replaceChildren();
              appendTableCell(td, td.dataset.ans);
              td.classList.add("ans-shown");
            }
          }
          tr.appendChild(td);
        });
        tbl.appendChild(tr);
      });
      cell.appendChild(tbl);

      /* 跳过的表格空位也要占掉答案位置，表格后的文字才能取到正确的答案 */
      if (q.tableAnsFromAns) ai += q.tableBlanks;

      if (q.textAfter){
        const afterSegs = makeFillSegs(q.textAfter, !!q.circleBlank, !!q.boxBlank, true);
        ai = appendSegs(cell, afterSegs, q.ans, ai, null);
      }
    }

    /* 答案区：sol 文字和答案图片只在“显示答案”时出现 */
    const ansImgs = Array.isArray(q.ansImg) ? q.ansImg : (q.ansImg ? [q.ansImg] : []);
    if ((q.sol && q.sol.length) || ansImgs.length){
      cell.classList.add("has-sol");
      const sol = document.createElement("div");
      sol.className = "sol";
      sol.style.display = showAnswer ? "block" : "none";
      (q.sol || []).forEach(s => {
        const d = document.createElement("div");
        appendTextWithBreaks(d, s, null);
        sol.appendChild(d);
      });
      ansImgs.forEach(src => {
        const img = document.createElement("img");
        img.className = "sol-img" + (ansImgs.length > 1 ? " sol-img-multi" : "");
        img.alt = "";
        loadImg(img, src);
        sol.appendChild(img);
      });
      cell.appendChild(sol);
    }

    return cell;
  }

  /* ---------- 三：选择题（来自学情调研「选择」卷） ---------- */
  const CHOICE_QUESTIONS = [
    { num: 14, text: "下面算式中，先算减法的是（）。", ans: ["A"], n: 3,
      options: ["A. 3×(9-2)", "B. 59-9×6", "C. 45-35÷7", "D. 100-(60+30)"] },
    { num: 15, text: "妈妈买了3箱牛奶，每箱24盒，小军用竖式算出了一共有多少盒牛奶。竖式中框出的进位“1”表示（）。",
      ans: ["C"], img: "img/choice-q2.svg", imgLines: 5, n: 9,
      options: ["A. 1箱牛奶", "B. 1盒牛奶", "C. 10盒牛奶", "D. 10箱牛奶"] },
    { num: 16, text: "张阿姨陪同4位老人坐火车去旅游，火车单程票价每张205元。张阿姨准备（）元买票比较合适。", ans: ["D"], n: 4,
      options: ["A. 800", "B. 900", "C. 1000", "D. 1100"] },
    { num: 17, text: "如图，如果涂色部分表示410，那么整个图形表示（）。", ans: ["B"], img: "img/shape8.png", imgLines: 4, n: 7,
      options: ["A. 410×7", "B. 410×8", "C. 410×6", "D. 410×4"] },
    { num: 18, text: "阳光社区打印了600份垃圾分类手册，组织了8位志愿者免费发放给社区居民，已经发放了528份，（）？如果列式为(600-528)÷8，那么括号里的问题是（）。",
      ans: ["平均每位志愿者还需发放几份", "B"], n: 5,
      options: ["A. 需要几位志愿者发放", "B. 平均每位志愿者还需发放几份", "C. 已经发放了多少份", "D. 还需要发放多少份"] }
  ];

  /* ---------- 四：操作题（统计与数据分析） ---------- */
  const OPERATION_QUESTIONS = [
    { num: 23, n: 8,
      text: "小明收集了自己班女生1分钟跳绳的成绩。",
      tables: [
        {
          rows: [
            ["序号", "成绩/个", "序号", "成绩/个", "序号", "成绩/个", "序号", "成绩/个"],
            ["1", "72", "5", "88", "9", "55", "13", "76"],
            ["2", "85", "6", "95", "10", "76", "14", "104"],
            ["3", "45", "7", "100", "11", "36", "15", "101"],
            ["4", "16", "8", "98", "12", "87", "16", "99"]
          ]
        },
        {
          rows: [
            ["成绩", "50个以下", "50~84（包含50、84）", "84个以上"],
            ["人数", "", "", ""]
          ],
          ans: [
            ["成绩", "50个以下", "50~84（包含50、84）", "84个以上"],
            ["人数", "2", "6", "8"]
          ],
          afterSub: 1
        }
      ],
      subs: [
        "(1) 整理上表中的数据：",
        "(2) 这个班女生1分钟跳绳的最好成绩是（）个，最差成绩是（）个，这两个成绩相差（）个。"
      ],

  /* ---------- 五：解决问题（来自学情调研「应用」卷） ---------- */
  const APP_QUESTIONS = [
