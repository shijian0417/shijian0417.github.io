<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>小学作业设计 · 自动出题</title>
<style>
  :root{
    --line: 46px;          /* 横格行高，题目按此对齐 */
    --paper: #fffdf7;      /* 纸张底色 */
    --rule:  #b7cfe8;      /* 横格线颜色 */
    --margin:#e9a3a3;      /* 左侧红线 */
    --ink:   #1f2933;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:#dfe6ee;
    font-family:"KaiTi","STKaiti","楷体","Songti SC",serif;
    color:var(--ink);
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:28px 16px 60px;
  }

  /* ---------- 纸张 ---------- */
  .paper{
    width:880px;
    max-width:100%;
    background:var(--paper);
    box-shadow:0 6px 22px rgba(0,0,0,.18);
    border:1px solid #d8d2c6;
    border-radius:2px;
    padding:26px 30px 34px 30px;
  }

  /* ---------- 标题区 ---------- */
  .title{
    text-align:center;
    font-size:32px;
    font-weight:700;
    letter-spacing:8px;
    margin:0 0 14px;
  }
  .meta{
    display:flex;
    gap:36px;
    justify-content:flex-end;
    font-size:16px;
    margin-bottom:16px;
    color:#3a4a5a;
  }
  .meta i{
    display:inline-block;
    width:110px;
    border-bottom:1px solid #9aa7b4;
    height:16px;
  }

  /* ---------- 带横格的答题区 ---------- */
  .ruled{
    position:relative;
    padding-left:58px;              /* 与左侧红色装订线右边缘对齐 */
    padding-right:10px;
    background-image:
      linear-gradient(90deg, transparent 0 54px, var(--margin) 54px 58px, transparent 58px),
      repeating-linear-gradient(to bottom,
        transparent 0,
        transparent calc(var(--line) - 1px),
        var(--rule) calc(var(--line) - 1px),
        var(--rule) var(--line));
    background-repeat:no-repeat, repeat;
    background-position:0 0, 0 var(--line);
  }
  .section-title{
    height:var(--line);
    line-height:var(--line);
    font-size:20px;
    font-weight:700;
    letter-spacing:1px;
  }
  /* ---------- 大类标题（如「一：计算题。」），占一行横格，与分类标题区分 ---------- */
  .cat-title{
    height:var(--line);
    line-height:var(--line);
    font-size:22px;
    font-weight:800;
    letter-spacing:2px;
    color:#1f2a36;
  }

  /* ---------- 题目网格：4 列 × 5 行 = 20 题 ---------- */
  .problems{
    display:grid;
    grid-template-columns:repeat(4, 1fr);
    /* 普通题按一行横线高；带表格的计算题可以让所在行按内容自动撑高 */
    grid-auto-rows:minmax(var(--line), auto);
  }
  .item{
    display:flex;
    align-items:center;
    font-size:20px;
    letter-spacing:.5px;
    white-space:nowrap;
  }
  /* 计算题带表格：单独占满一行，表格放在算式下方 */
  .item.has-table, .vitem.has-table{
    display:block;
    grid-column:1 / -1;
    height:auto;
    white-space:normal;
  }
  .vitem.has-table{min-height:calc(var(--line) * 2);}
  .item.has-table .fill-table, .vitem.has-table .fill-table{width:auto;max-width:100%;}
  .calc-after{display:block;margin-top:4px;}
  .eq{margin-right:2px;}
  .ans{
    font-size:19px;
    color:#c0392b;
    margin-left:4px;               /* 答案与算式之间的小间距 */
  }
  .table-ans.ans-shown{ color:#c0392b; }    /* 表格中点击“显示答案”后填充的隐藏数据用红色 */

  /* ---------- 三：递等式计算的 4 行间隔，留出 = 号宽度 ---------- */
  #bproblems{
    padding-left:18px;              /* 在红色装订线与算式之间空出约一个 "=" 号的位置 */
    row-gap:calc(var(--line) * 2);  /* 递等式换行时（A4 窄幅/手机上每行 2 题）空两行书写 */
  }

  /* ---------- 四：算一算，比一比（3 列；第一行递等式空 2 行，第二行竖式后空 3 行） ---------- */
  #cmpproblems{
    display:grid;
    grid-template-columns:repeat(3, 1fr);
    column-gap:28px;
    padding-left:18px;
  }
  .cmpcol{
    display:flex;
    flex-direction:column;
    font-size:20px;
    letter-spacing:.5px;
  }
  .cmprow{
    display:flex;
    align-items:center;
    height:var(--line);
    white-space:nowrap;
  }
  .cmpgap2{height:calc(var(--line) * 2);}   /* 第一行递等式与第二行竖式之间 */
  .cmpgap3{height:calc(var(--line) * 3);}   /* 第二行竖式到下面填空之间 */
  /* 递等式板块下方留 2 行书写（竖式计算每题本身已留 4 行高度，含 3 行书写） */
  .calc-gap2{height:calc(var(--line) * 2);}

  /* ---------- 大类标题前的空行（如递等式之后空 2 行） ---------- */
  .blank2{height:calc(var(--line) * 2);}

  /* ---------- 4.单位换算填空：一行两题 ---------- */
  #cproblems{
    display:grid;
    grid-template-columns:repeat(2, 1fr);
    grid-auto-rows:minmax(var(--line), auto);   /* 普通换算题 46px，带图题按内容增高 */
  }
  .fillitem{
    display:flex;
    align-items:center;
    font-size:20px;
    letter-spacing:.5px;
    white-space:nowrap;
  }
  .fillitem .eq, .fillitem .ans{margin:0;}   /* 括号与填入的答案紧贴 */
  /* 有答案文字/答案图片的填空题：答案块另起一行，避免参与 flex 横排把题干和图片挤窄 */
  .fillitem.has-sol{display:block;}
  .fillitem .ans{
    display:inline-block;             /* 让 min-width 在 flex / block 两种布局下都生效 */
    min-width:3em;                 /* 括号内留出书写答案的空间（字号的 3 倍，约 57px） */
    text-align:center;             /* 答案居中，显示前后括号位置不变 */
  }
  /* Word 导入的多行填空题：空位书写宽度略收窄，保证一行两/三小题不折行 */
  .fillitem.fill-dense .ans{min-width:2.5em;}

  /* ---------- 5.及以后：调研卷填空题（长题干，单列自动换行） ---------- */
  #fillbank{
    display:grid;
    grid-template-columns:1fr;
    grid-auto-rows:auto;
  }
  #fillbank .fillitem{
    display:block;                /* 题干与空位按行内流排布，长题干自动换行 */
    white-space:normal;
    line-height:var(--line);
    min-height:var(--line);
    padding-top:3px;
  }
  /* 带题面说明（2NN00）的填空 slot：和填空第 1 题一样按两列排，
     避免短小的单位换算题只占左半栏、右侧大片留白 */
  #fillbank .fill-slot-block{display:block;}
  #fillbank .fill-slot-grid{
    display:grid;
    /* 宽度够时两列；A4 边距较大、两列放不下时自动变一列，避免题目被挤成多行 */
    grid-template-columns:repeat(auto-fit, minmax(318px, 1fr));
    grid-auto-rows:minmax(var(--line), auto);
  }
  #fillbank .fill-slot-grid .fillitem{
    display:flex;
    align-items:center;
    min-width:0;
    font-size:20px;
    letter-spacing:.5px;
    white-space:normal;
    padding-top:0;
  }
  #fillbank .fill-slot-grid .fillitem.fill-long{
    grid-column:1 / -1;
    display:block;
    padding-top:3px;
  }
  /* 题干中要求划横线的文字（[[文字]]），所有板块通用 */
  .uline{
    text-decoration:underline;
    text-underline-offset:3px;
  }
  /* 固定长度横线 [[_8]]：全角空格不会被 HTML 折叠，且不跨行断开 */
  .uline-blank{white-space:nowrap;}
  /* 填空题里当答题空位用的横线 [[_8]]：横线常显，显示答案时答案写在横线上 */
  .uline-ans{
    display:inline-block;
    text-align:center;
    border-bottom:1px solid currentColor;
    line-height:1.25;
  }
  /* 文字间距 [[sp]] / [[sp3]]：保留全角空格宽度 */
  .spacing{white-space:pre;}
  /* 括号内答题空位 [[b]] / [[b5]]：宽度与填空题括号内的书写空位一致（默认 3em） */
  .gapblank{display:inline-block;height:1em;vertical-align:-.15em;min-width:3em;}
  /* 括号 + 答案作为一个整体，不拆行 */
  .blank{white-space:nowrap;}
  /* 圆圈 / 方框空位：打印时保留 ○ / □；显示答案时把答案压在圆圈 / 方框内 */
  .blank.circle, .blank.box{position:relative;display:inline-block;white-space:nowrap;}
  .blank.circle .glyph, .blank.box .glyph{display:inline-block;}
  .blank.circle .ans, .blank.box .ans{
    position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
    margin:0;min-width:0;font-size:.62em;line-height:1;text-align:center;
  }
  /* 带图题：宽栏文字在左、图在右；两列窄栏（题号 4）改为图在文字下方，避免遮挡与超宽 */
  .q-with-img{display:flex;align-items:flex-start;gap:12px;}
  .q-with-img .q-text{flex:1;min-width:0;}
  .q-with-img img{display:block;flex-shrink:0;max-width:180px;height:auto;}
  #cproblems .fillitem{white-space:normal;}
  /* 长题干（如整段单位填空）跨两栏、按块级换行 */
  #cproblems .fillitem.fill-long{
    grid-column:1 / -1;
    display:block;
    white-space:normal;
    line-height:var(--line);
    padding-top:3px;
  }
  #cproblems .fillitem .q-with-img{display:block;}
  #cproblems .fillitem .q-with-img img{max-width:100%;margin-top:4px;}
  /* 图片四向位置（imgPos = top / bottom / left / right）；未指定时保持上面的默认布局 */
  .q-with-img.img-left, .q-with-img.img-right{display:flex;}
  .q-with-img.img-top, .q-with-img.img-bottom{display:block;}
  .q-with-img.img-left img{margin:0 12px 0 0;}
  .q-with-img.img-right img{margin:0 0 0 12px;}
  .q-with-img.img-top img{margin:0 0 6px;}
  .q-with-img.img-bottom img{margin:6px 0 0;}
  /* 填空 2~10 题：图片独占一行时不要沿用图文左右排的 180px 上限，按单栏宽度显示 */
  #fillbank .fillitem .q-with-img.img-top img,
  #fillbank .fillitem .q-with-img.img-bottom img{max-width:100%;}
  #fillbank .fillitem .q-with-img.img-left img,
  #fillbank .fillitem .q-with-img.img-right img{max-width:45%;}
  #cproblems .fillitem .q-with-img.img-left,
  #cproblems .fillitem .q-with-img.img-right{display:flex;}
  #cproblems .fillitem .q-with-img.img-left img{max-width:45%;margin:0 8px 0 0;}
  #cproblems .fillitem .q-with-img.img-right img{max-width:45%;margin:0 0 0 8px;}
  /* 多图题：多张图片按行自动换行，保持原始比例 */
  .qimg-list{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-start;}
  .qimg-list img{display:block;max-width:100%;height:auto;flex:0 0 auto;margin:0;}
  .sitem .qimg-list, .aitem .qimg-list{max-width:calc(100% - 24px);margin-left:24px;}
  .sitem .qimg-list .qimg, .aitem .qimg-list .qimg{max-width:100%;margin:0;}
  .q-with-img .qimg-list{max-width:100%;}
  .q-with-img.img-left .qimg-list, .q-with-img.img-right .qimg-list{max-width:45%;}
  .q-stem.img-left .qimg-list{margin:0 24px 0 0;}
  .q-stem.img-right .qimg-list{margin:0 0 0 24px;}
  .q-stem.img-top .qimg-list{margin:0 0 6px 24px;}
  .q-stem.img-bottom .qimg-list{margin:6px 0 0 24px;}
  /* 图片自身水平对齐：左对齐 / 居中 / 右对齐 */
  .qimg-wrap.img-align-left{display:flex;align-items:flex-start;justify-content:flex-start;}
  .qimg-wrap.img-align-center{display:flex;align-items:flex-start;justify-content:center;}
  .qimg-wrap.img-align-right{display:flex;align-items:flex-start;justify-content:flex-end;}

  /* 选择题 / 操作题 / 解决问题：题干与图片的四向布局 */
  .q-stem{display:block;}
  .q-stem.media-row{display:flex;align-items:flex-start;gap:12px;}
  .q-stem.media-row .stext, .q-stem.media-row .atext{flex:1;min-width:0;}
  .q-stem.media-row .qimg-wrap{flex:0 0 auto;}
  /* 明确指定位置时，图片容器按图片实际高度排，不再预留默认的 4 行空白 */
  .q-stem.img-top .qimg-wrap, .q-stem.img-bottom .qimg-wrap,
  .q-stem.media-row .qimg-wrap{min-height:0;}
  .q-stem.img-left .qimg{margin:0 24px 0 0;}
  .q-stem.img-right .qimg{margin:0 0 0 24px;}
  .q-stem.img-top .qimg{margin:0 0 6px 24px;}
  .q-stem.img-bottom .qimg{margin:6px 0 0 24px;}
  /* 调研卷填空题中的表格（如第11题思考过程） */
  .fill-table{
    border-collapse:collapse;
    margin:4px 0;
    font-size:18px;
  }
  .fill-table td{
    border:1px solid #999;
    padding:3px 14px;
    text-align:center;
    min-width:2em;
    background:#fff;              /* 遮住答题纸的横线，避免透进表格 */
  }
  /* 表格单元格里的图片（Word 导入的操作题实验图等） */
  .fill-table td .tbl-img{
    display:block;
    max-width:100%;
    height:auto;
    margin:2px auto;
  }
  /* 填空区内的统计表：不继承答题横线的行高，否则行高被撑得过大 */
  .fillitem .fill-table td{line-height:1.45;padding:5px 14px;}
  /* 整行单元格为空时（如表格第二行留给学生填写），整行会被压成一条线：
     用不可见空格撑出一行文字的高度，保证与有内容的行一样高 */
  .fill-table:not(.plain) td:empty::after{content:"\00a0";}
  /* 无边框表格：用于「算一算」这类需要按列对齐、但不画格线的填空 */
  .fill-table.plain{
    border:none;
    table-layout:fixed;
    width:100%;
  }
  .fill-table.plain td{
    border:none;
    padding:2px 10px;
    text-align:left;
    min-width:0;
  }
  .fill-table.plain.center td{text-align:center;}
  /* 单元格文字对齐：默认居中；后台可按表格选择左 / 右对齐 */
  .fill-table.align-left td{text-align:left;}
  .fill-table.align-right td{text-align:right;}
  /* 表格标题 + 右上角日期（统计表上方）：标题独占一行，日期在其下一行靠右 */
  .table-block{display:inline-block;max-width:100%;}
  .table-head{display:block;margin:4px 0 2px;}
  .table-title{display:block;text-align:center;font-size:16px;font-weight:700;line-height:1.4;}
  .table-date{display:block;text-align:right;font-size:15px;line-height:1.4;white-space:nowrap;}
  /* 多张表格的排列方式：横排时左右并排（放不下自动换行），竖排为默认的上下排列 */
  .tables-row{display:flex;flex-wrap:wrap;align-items:flex-start;gap:8px 20px;}
  .tables-row > *{max-width:100%;}
  .tables-row > .fill-table{margin:4px 0;}
  /* 无边框表格默认占满整行；放进横排时改为按内容宽度并排，避免各自占满一行而被迫换行 */
  .tables-row > .fill-table.plain{width:auto;flex:0 1 auto;table-layout:auto;}

  /* ---------- 竖式计算：4 题横向排列，每题为竖式留出书写空间 ---------- */
  .vproblems{
    display:grid;
    grid-template-columns:repeat(4, 1fr);
    grid-auto-rows:minmax(calc(var(--line) * 4), auto);   /* 带表格的竖式题可自动撑高 */
  }
  .vitem{
    height:calc(var(--line) * 4);   /* 竖式书写留白 4 行 */
    padding-right:24px;             /* 横向间隔 */
    font-size:20px;
    letter-spacing:.5px;
    white-space:nowrap;
  }

  /* ---------- 三：选择题 ---------- */
  .sitem{
    box-sizing:content-box;
    min-height:calc(var(--line) * var(--n, 1));   /* 每行 46px，content 区正好是 46 的倍数，底部对齐横线 */
    page-break-inside:avoid;
  }
  .stext{
    font-size:20px;
    line-height:var(--line);
    letter-spacing:.5px;
  }
  .stext .ans{
    display:inline-block;
    min-width:3em;
    text-align:center;
  }
  .sitem .qimg-wrap{
    min-height:calc(var(--line) * var(--ni, 1));   /* 图片容器向上对齐到 46px 的整数倍 */
  }
  .sitem .qimg{
    display:block;
    max-width:170px;
    height:auto;
    margin:0 0 0 24px;
  }
  /* 选择题的选项合并在一张图里时，图片按题面宽度显示 */
  .sitem .qimg.qimg-wide{
    max-width:calc(100% - 24px);
  }
  .options{
    display:grid;
    grid-template-columns:repeat(2, 1fr);
    grid-auto-rows:minmax(var(--line), auto);   /* 至少一行高，长选项换行时自动撑高 */
    padding-left:24px;
  }
  .opt{
    display:flex;
    align-items:center;
    font-size:20px;
    letter-spacing:.5px;
    white-space:normal;                         /* 长选项自动换行，避免超出页边距 */
    padding-right:10px;
  }
  /* 图片选项：Markdown 导入的选择题可能每个选项都是一张图 */
  .options.has-imgs{grid-auto-rows:auto;}
  .options.has-imgs .opt{
    flex-direction:column;
    align-items:flex-start;
    white-space:normal;
  }
  .opt-img{
    display:block;
    max-height:86px;
    max-width:100%;
    height:auto;
    margin:2px 0;
  }
  .opt-label{font-size:20px;letter-spacing:.5px;}

  /* ---------- 四：操作题；五：解决问题 ---------- */
  .aitem{
    box-sizing:content-box;
    margin-bottom:var(--line);                    /* 题与题之间留一行答题空间 */
    min-height:calc(var(--line) * var(--n, 1));   /* content 区正好 46 的倍数，底部对齐横线 */
    page-break-inside:avoid;
  }
  .aitem .qimg-wrap{
    min-height:calc(var(--line) * var(--ni, 1));
  }
  .atext{
    font-size:20px;
    line-height:var(--line);
    letter-spacing:.5px;
  }
  .asub{
    font-size:20px;
    line-height:var(--line);
    letter-spacing:.5px;
    padding-left:24px;
  }
  /* 操作题 / 解决问题：括号内的答案与填空题一样留出 3 个全角字宽 */
  .aitem .blank .ans{
    display:inline-block;
    min-width:3em;
    margin:0;
    text-align:center;
  }
  .aitem .qimg{
    display:block;
    max-width:340px;
    height:auto;
    margin:0 0 0 24px;
  }
  /* imgWide：横跨整行的插图（如统计数据的“正”字截图），不受 340px 限制 */
  .aitem .qimg.qimg-wide{max-width:100%;}
  /* 操作题中连续出现的统计表之间留出间隔，避免两表粘成一张 */
  #oproblems .fill-table{margin:6px 0 12px;}
  /* 操作题最后一题与「五：解决问题」大类标题之间不留空行（需要时在题干末尾手动加 [[br]]） */
  #oproblems > .aitem:last-child{margin-bottom:0;}
  /* 图片路径找不到时的占位提示（屏幕和打印都可见） */
  .img-missing{
    display:inline-block;
    padding:2px 10px;
    border:1px dashed #c0392b;
    border-radius:3px;
    color:#c0392b;
    font-size:13px;
    line-height:1.7;
  }
  .sol{
    font-size:18px;
    color:#c0392b;
    line-height:calc(var(--line) * .8);
    padding-left:24px;
  }
  .sol-img{display:block;max-width:360px;height:auto;margin-top:6px;}

<body>

  <div class="paper">

<script>
  const rnd = (min, max) => Math.floor(Math.random() * (max - min + 1)) + min;

  /* 两位数 × 一位数，如 32×3= 或 3×32= */
  function makeMul(){
    const a = rnd(12, 99), b = rnd(2, 9);
    return Math.random() < 0.5
      ? { text: a + "×" + b + "=", ans: a * b }
      : { text: b + "×" + a + "=", ans: a * b };
  }

  /* 一位数 × 一位数 + 一位数，如 5×9+3= 或 3+5×9= */
  function makeMulAdd(){
    const a = rnd(2, 9), b = rnd(2, 9), c = rnd(1, 9);
    return Math.random() < 0.5
      ? { text: a + "×" + b + "+" + c + "=", ans: a * b + c }
      : { text: c + "+" + a + "×" + b + "=", ans: a * b + c };
  }

  /* 两位数 ÷ 一位数（只要商是整数，不需要十位、个位分别能整除除数） */
  function makeDiv2(){
    for (let i = 0; i < 200; i++){
      const d = rnd(2, 9);
      const q = rnd(2, 49);                    // 商 q：两位数上限 99 / 2 = 49
      const div = q * d;                       // div = q * d 必然满足 div % d === 0
      if (div < 10 || div > 99) continue;
      return { text: div + "÷" + d + "=", ans: q };
    }
    return { text: "64÷2=", ans: 32 };        /* 兜底：64 / 2 = 32 ✓ */
  }

  /* 三位数 ÷ 一位数（口算级，每一位都能整除除数，无余数） */
  function makeDiv3(){
    for (let i = 0; i < 200; i++){
      const d = rnd(2, 9);
      const h = rnd(1, 9);
      const t = rnd(0, 9);
      const o = rnd(0, 9);
      if (h % d !== 0) continue;
      if (t % d !== 0) continue;
      if (o % d !== 0) continue;
      const div = h * 100 + t * 10 + o;
      if (div % d !== 0) continue;
      return { text: div + "÷" + d + "=", ans: div / d };
    }
    return { text: "408÷4=", ans: 102 };   /* 兜底：4、0、8 都能被 4 整除 ✓ */
  }

  /* 整百整十 / 整千整百 口算除法的合格性判定（pow = 10 或 100，即末尾 0 的位数）：
     ① 去掉末尾 0 后的「前两位」÷ 除数 能整除且商是一位数（如 4000÷5 中 40÷5=8、320÷8 中 32÷8=4）；
     ② 每一位都能被除数整除（如 5500÷5 中 5、5、0、0 都能被 5 整除）。
     反例：9000÷5（90÷5=18 两位数商，9%5≠0）、900÷6（90÷6=15，9%6≠0）均不合格。 */
  function okRoundDiv(div, d, pow){
    const head = Math.floor(div / pow);                              // 去掉末尾 0 后的前两位
    if (head % d === 0 && head / d <= 9) return true;                // 条件 ①
    return String(div).split("").every(x => Number(x) % d === 0);    // 条件 ②
  }

  /* 整十数 / 整百数 ÷ 一位数（三位数，10 的倍数），如 320÷8、400÷5、600÷3；商为整十数。
     需满足 okRoundDiv 的两个条件之一，与四位数整千/整百同一规则 */
  function makeDivTens(){
    for (let i = 0; i < 400; i++){
      const d = rnd(2, 9);
      const qMin = Math.ceil(100 / d / 10) * 10;      // 商为整十数，且使被除数 ≥ 100
      const qMax = Math.floor(999 / d / 10) * 10;     // 商为整十数，且使被除数 ≤ 999
      if (qMax < qMin) continue;
      const q = rnd(qMin / 10, qMax / 10) * 10;       // 整十商：10, 20, …, 990
      const div = q * d;                              // 被除数 = 整十商 × 一位数 → 10 的倍数
      if (div < 100 || div > 999 || div % 10 !== 0) continue;
      if (!okRoundDiv(div, d, 10)) continue;          // 前两位得一位数商，或每位都能被整除
      return { text: div + "÷" + d + "=", ans: q };
    }
    return { text: "320÷8=", ans: 40 };               /* 兜底：320÷8 中 32÷8=4 一位数商 ✓ */
  }

  /* 整千数 / 整百数 ÷ 一位数（四位数，100 的倍数），如 4000÷5、5500÷5、9000÷9；商为整百数。
     需满足 okRoundDiv 的两个条件之一，与三位数整十/整百同一规则 */
  function makeDivThousand(){
    for (let i = 0; i < 400; i++){
      const d = rnd(2, 9);
      const qMin = Math.ceil(1000 / d / 100) * 100;   // 商为整百数，且使被除数 ≥ 1000
      const qMax = Math.floor(9999 / d / 100) * 100;  // 商为整百数，且使被除数 ≤ 9999
      if (qMax < qMin) continue;
      const q = rnd(qMin / 100, qMax / 100) * 100;    // 整百商：100, 200, …, 9900
      const div = q * d;                              // 被除数 = 整百商 × 一位数 → 100 的倍数
      if (div < 1000 || div > 9999 || div % 100 !== 0) continue;
      if (!okRoundDiv(div, d, 100)) continue;         // 前两位得一位数商，或每位都能被整除
      return { text: div + "÷" + d + "=", ans: q };
    }
    return { text: "5500÷5=", ans: 1100 };            /* 兜底：55÷5=11 虽非一位商，但 5、5、0、0 都能被 5 整除 ✓ */
  }

  /* 生成 24 题：6 种口算类型各 4 题，随机打乱 */
  function build(){
    const list = [];
    for (let i = 0; i < 4; i++) list.push(makeMul());
    for (let i = 0; i < 4; i++) list.push(makeMulAdd());
    for (let i = 0; i < 4; i++) list.push(makeDiv2());
    for (let i = 0; i < 4; i++) list.push(makeDiv3());
    for (let i = 0; i < 4; i++) list.push(makeDivTens());
    for (let i = 0; i < 4; i++) list.push(makeDivThousand());
    for (let i = list.length - 1; i > 0; i--) {          // 洗牌
      const j = rnd(0, i);
      [list[i], list[j]] = [list[j], list[i]];
    }
    /* 标签 10101~10124：计算题 · 口算，每道题一个独立数字标签（5 位数，首位数 1 大类，后四位精确到题） */
    return list.map((q, i) => Object.assign({ tag: String(10101 + i) }, q));
  }

  /* ================= 二：用竖式计算（5 题，三位数 × 一位数） ================= */
  /* 一位数与三位数随机决定先后顺序 */
  function mulPair(n, b){
    return Math.random() < 0.5
      ? { text: n + "×" + b + "=", ans: n * b }
      : { text: b + "×" + n + "=", ans: n * b };
  }

  /* 三位数中间是 0，如 804 */
  function makeMulMidZero(){
    const n = rnd(1, 9) * 100 + rnd(1, 9);      // 十位为 0
    return mulPair(n, rnd(2, 9));               // 一位数不含 0
  }

  /* 三位数末尾是 0，如 630 */
  function makeMulEndZero(){
    const n = rnd(1, 9) * 100 + rnd(1, 9) * 10; // 个位为 0
    return mulPair(n, rnd(2, 9));
  }

  /* 三位数各数位都不含 0，如 637 */
  function makeMulNoZero(){
    const n = rnd(1, 9) * 100 + rnd(1, 9) * 10 + rnd(1, 9);
    return mulPair(n, rnd(2, 9));
  }

  /* 生成 4 题：中间有 0、末尾有 0 各 1 题，其余 2 题不含 0，位置随机 */
  function buildVertical(){
    const list = [
      makeMulMidZero(),
      makeMulEndZero(),
      makeMulNoZero(),
      makeMulNoZero()
    ];
    for (let i = list.length - 1; i > 0; i--) {
      const j = rnd(0, i);
      [list[i], list[j]] = [list[j], list[i]];
    }
    /* 标签 10201~10204：计算题 · 竖式 */
    return list.map((q, i) => Object.assign({ tag: String(10201 + i) }, q));
  }

  let showAnswer = false;

  /* ================= 三：递等式计算（固定 4 题，最多 2 步混合） ================= */
  /* 运算符号替换：文本用 × ÷，求值时换成 * /（算式末尾不带 = 号） */
  const toExpr = text => text.replace(/×/g, "*").replace(/÷/g, "/").replace(/=/g, "");

  /* 安全求值（整数 & 非负） */
  const safeEval = text => {
    try {
      const v = Function("return " + toExpr(text))();
      return Number.isInteger(v) && v >= 0 ? v : null;
    } catch { return null; }
  };

  /* 构造一个"每一位都能被除数 d 整除"的三位数（供 Type3 / Type4 除法使用） */
  function make3digitDivBy(d){
    for (let i = 0; i < 200; i++){
      const n = rnd(100, 999);
      const h = Math.floor(n/100), t = Math.floor((n/10)%10), o = n%10;
      if (h % d === 0 && t % d === 0 && o % d === 0) return n;
    }
    return d * 100 + d * 10 + d;  /* 兜底：ddd 形式 */
  }

  /* ============ 第 1 题：加减混合（最多 2 步 = 3 个数，纯 + −） ============
     A ± B ± C；每一步中间结果都 ≥ 0；A/B/C 均为 2/3 位随机。 */
  function makeBlend1(){
    /* 2 位或 3 位随机 */
    const pick23 = () => Math.random() < 0.5 ? rnd(10, 99) : rnd(100, 999);
    for (let i = 0; i < 500; i++){
      const A = pick23(), B = pick23(), C = pick23();

      const op1 = Math.random() < 0.5 ? "+" : "-";
      const op2 = Math.random() < 0.5 ? "+" : "-";

      const s1 = op1 === "+" ? A + B : A - B;
      if (s1 < 0) continue;
      const final = op2 === "+" ? s1 + C : s1 - C;
      if (final < 0) continue;

      const text = `${A}${op1}${B}${op2}${C}`;     /* 不带 = 号 */
      if (safeEval(text) !== final) continue;
      return { text, ans: final };
    }
    return { text: "627+145-243", ans: 529 };
  }

  /* ============ 第 2 题：乘加/乘减、除加/除减 混合（最多 2 步） ============
     乘法类：a×b ± C  或  C ± a×b（a 为 2/3 位数，b 为 1 位数，C ≥ 0）
     除法类：a÷b ± c  或  c ± a÷b（a 为 2/3 位数且能被 b 整除，b 为 1 位数）
     减法时保证被减数足够大，结果非负。乘法类 / 除法类各占 50%。 */
  function makeBlend2(){
    const pick23 = () => Math.random() < 0.5 ? rnd(10, 99) : rnd(100, 999);
    const pickC = () => {
      const len = Math.random() < 0.4 ? 1 : (Math.random() < 0.5 ? 2 : 3);
      return len === 3 ? rnd(100,999) : len === 2 ? rnd(10,99) : rnd(1,9);
    };

    for (let i = 0; i < 500; i++){
      if (Math.random() < 0.5){
        /* ===== 乘法类 ===== */
        const a = pick23();
        const b = rnd(2, 9);
        const prod = a * b;

        let text, ans;
        if (Math.random() < 0.5){
          /* a×b ± C */
          const op = Math.random() < 0.5 ? "+" : "-";
          /* 减法时反向构造 C（C ≤ 乘积），保证结果非负 */
          const C = op === "-" ? rnd(1, Math.min(prod - 1, 999)) : pickC();
          text = `${a}×${b}${op}${C}`;
          ans = op === "+" ? prod + C : prod - C;
        } else {
          /* C ± a×b */
          const op = Math.random() < 0.5 ? "+" : "-";
          /* 减法时反向构造 C（C > 乘积且 ≤ 999），保证结果非负 */
          if (op === "-" && prod > 998) continue;
          const C = op === "-" ? rnd(prod + 1, 999) : pickC();
          text = `${C}${op}${a}×${b}`;
          ans = op === "+" ? C + prod : C - prod;
        }
        if (ans < 0) continue;
        if (safeEval(text) !== ans) continue;
        return { text, ans };

      } else {
        /* ===== 除法类：直接构造 a = b×q，天然整除 ===== */
        const b = rnd(2, 9);
        const twoDigit = Math.random() < 0.5;          /* a 取 2 位或 3 位 */
        const qmin = Math.ceil((twoDigit ? 10 : 100) / b);
        const qmax = Math.floor((twoDigit ? 99 : 999) / b);
        if (qmax < qmin) continue;
        const a = b * rnd(qmin, qmax);
        const quot = a / b;

        let text, ans;
        if (Math.random() < 0.5){
          /* a÷b ± c */
          const op = Math.random() < 0.5 ? "+" : "-";
          /* 减法时反向构造 c（c < 商），保证结果非负 */
          const c = op === "-" ? rnd(1, quot - 1) : pickC();
          text = `${a}÷${b}${op}${c}`;
          ans = op === "+" ? quot + c : quot - c;
        } else {
          /* c ± a÷b */
          const op = Math.random() < 0.5 ? "+" : "-";
          /* 减法时反向构造 c（c > 商且 ≤ 999），保证结果非负 */
          const c = op === "-" ? rnd(quot + 1, 999) : pickC();
          text = `${c}${op}${a}÷${b}`;
          ans = op === "+" ? c + quot : c - quot;
        }
        if (ans < 0) continue;
        if (safeEval(text) !== ans) continue;
        return { text, ans };
      }
    }
    return { text: "235×4-9", ans: 931 };
  }

  /* ============ 第 3 题：连乘 或 乘除 混合（最多 2 步） ============
     连乘: a×b×c（前两数乘积最多 3 位，即 a×b ≤ 999）
     乘除: a×b÷d 或 a÷b×d（除数恒为 1 位；÷ 必须整除；a×b 乘积 ≤ 999）
     权重：连乘 30%，乘÷混合 70%，后者再按 a×b÷d / a÷b×d 分配。
     注意：a×b÷d 只要求乘积能被 d 整除即可，不再要求乘积的每一位都能被 d 整除
     （否则通过率极低、生成不出足够乘除题）。a÷b×d 仍保持 a 每一位都能被 b 整除。 */
  function makeBlend3(){
    for (let i = 0; i < 500; i++){
      const b = rnd(2, 9);
      const aMax = Math.max(100, Math.floor(999 / b));
      const a = rnd(100, aMax);
      const prod = a * b;
      if (prod > 999) continue;

      if (Math.random() < 0.3){
        /* 连乘 a×b×c */
        const c = rnd(2, 9);
        const ans = prod * c;
        const text = `${a}×${b}×${c}`;
        if (safeEval(text) !== ans) continue;
        return { text, ans };
      } else {
        /* 乘÷混合 */
        const d = rnd(2, 9);
        if (Math.random() < 0.75){
          /* a×b÷d：只要求乘积 prod 能被 d 整除即可 */
          if (prod % d !== 0) continue;
          const text = `${a}×${b}÷${d}`;
          return { text, ans: prod / d };
        } else {
          /* a÷b×d —— a 每一位都能被 b 整除 */
          if (a % b !== 0) continue;
          const h = Math.floor(a/100), t = Math.floor((a/10)%10), o = a%10;
          if (h % b !== 0 || t % b !== 0 || o % b !== 0) continue;
          const text = `${a}÷${b}×${d}`;
          const ans = a / b * d;
          if (safeEval(text) !== ans) continue;
          return { text, ans };
        }
      }
    }
    /* 兜底：连乘 100×2×3=600，前两数 200 是三位数 ✓ */
    return { text: "100×2×3", ans: 600 };
  }

  /* ============ 第 4 题：含小括号的混合（最多 2 步，仅当必须改变运算顺序才加括号） ============
     合法加括号的情况（9 种，都是 2 个运算符、3 个操作数）：
       1) (a±X)×one   —— 先加/减再乘；不加括号会先算 ×，改变顺序 ✓
       2) (a±X)÷one   —— 先加/减再除；不加括号会先算 ÷，改变顺序 ✓
          （inner 只需整体能被 one 整除即可，不再要求 inner 每一位都能被 one 整除，
           因为这是混合运算中的除法，不同于口算除法题）
       3) one×(a±X)   —— 先加/减再乘；不加括号会先算 one×a，改变顺序 ✓
       4) a-(b-c)     —— 先算括号内减法，再相减；不加括号会先算 a-b，改变顺序 ✓
       5) a-(b+c)     —— 先算括号内加法，再相减；不加括号会先算 a-b，改变顺序 ✓
       6) a×(b-c)     —— 先算括号内减法，再相乘；不加括号会先算 a×b，改变顺序 ✓
       7) a×(b+c)     —— 先算括号内加法，再相乘；不加括号会先算 a×b，改变顺序 ✓
       8) a÷(b-c)     —— 先算括号内减法，再相除；不加括号会先算 a÷b，改变顺序 ✓
       9) a÷(b+c)     —— 先算括号内加法，再相除；不加括号会先算 a÷b，改变顺序 ✓
     共同约束：结果必须为整数且非负；
               1)~3) 中 inner（括号内算出来的值）需 0 ≤ inner ≤ 999
               （因为任何乘法里的乘数 ≤ 999；除法里 inner 是被除数也应 ≤ 999）；
               6)~9) 中括号内结果取 1 位，保证是"两/三位数 ×÷ 一位数"；
               8)~9) 中 a 为 2/3 位数，且按 d×q 反推构造，天然能被括号内的值整除。 */
  function makeBlend4(){
    const pick23 = () => Math.random() < 0.5 ? rnd(10, 99) : rnd(100, 999);
    const pickLen = () => Math.random() < 0.4 ? 1 : (Math.random() < 0.5 ? 2 : 3);
    const pickNum = len => len === 3 ? rnd(100,999) : len === 2 ? rnd(10,99) : rnd(1,9);

    for (let i = 0; i < 500; i++){
      const r = Math.random();

      if (r < 0.16){
        /* 1) (a±X)×one */
        const a = rnd(100, 999);
        const X = pickNum(pickLen());
        const one = rnd(2, 9);
        const opInner = Math.random() < 0.5 ? "+" : "-";
        const inner = opInner === "+" ? a + X : a - X;
        if (inner < 0 || inner > 999) continue;
        const text = `(${a}${opInner}${X})×${one}`;
        const ans = inner * one;
        if (safeEval(text) !== ans) continue;
        return { text, ans };

      } else if (r < 0.30){
        /* 2) (a±X)÷one：先取 one 的整数倍作为 inner，再反推 a，保证整除 */
        const one = rnd(2, 9);
        const inner = one * rnd(1, Math.floor(999 / one));
        const X = pickNum(pickLen());
        const opInner = Math.random() < 0.5 ? "+" : "-";
        const a = opInner === "+" ? inner - X : inner + X;   /* 使 a ± X = inner */
        if (a < 100 || a > 999) continue;
        const text = `(${a}${opInner}${X})÷${one}`;
        const ans = inner / one;
        if (safeEval(text) !== ans) continue;
        return { text, ans };

      } else if (r < 0.44){
        /* 3) one×(a±X) */
        const a = rnd(100, 999);
        const X = pickNum(pickLen());
        const one = rnd(2, 9);
        const opInner = Math.random() < 0.5 ? "+" : "-";
        const inner = opInner === "+" ? a + X : a - X;
        if (inner < 0 || inner > 999) continue;
        const text = `${one}×(${a}${opInner}${X})`;
        const ans = one * inner;
        if (safeEval(text) !== ans) continue;
        return { text, ans };

      } else if (r < 0.56){
        /* 4) a-(b-c)：先算 b-c，再用 a 减 */
        const a = rnd(100, 999);
        const b = pick23();
        const c = pick23();
        if (b <= c) continue;
        const ans = a - (b - c);
        if (ans < 0) continue;
        const text = `${a}-(${b}-${c})`;
        if (safeEval(text) !== ans) continue;
        return { text, ans };

      } else if (r < 0.68){
        /* 5) a-(b+c)：先算 b+c，再用 a 减 */
        const a = rnd(100, 999);
        const b = pick23();
        const c = pick23();
        const ans = a - (b + c);
        if (ans < 0) continue;
        const text = `${a}-(${b}+${c})`;
        if (safeEval(text) !== ans) continue;
        return { text, ans };

      } else if (r < 0.77){
        /* 6) a×(b-c)：括号内取 1 位结果，保证是两/三位数乘一位数 */
        const a = pick23();
        const b = rnd(2, 9);
        const c = rnd(1, b - 1);
        const text = `${a}×(${b}-${c})`;
        const ans = a * (b - c);
        if (safeEval(text) !== ans) continue;
        return { text, ans };

      } else if (r < 0.86){
        /* 7) a×(b+c)：括号内取 1 位结果，保证是两/三位数乘一位数 */
        const a = pick23();
        const b = rnd(1, 8);
        const c = rnd(1, 9 - b);
        const text = `${a}×(${b}+${c})`;
        const ans = a * (b + c);
        if (safeEval(text) !== ans) continue;
        return { text, ans };

      } else if (r < 0.93){
        /* 8) a÷(b-c)：括号内差为一位数（2~8，避免除以 1），a 按 d×q 构造保证整除 */
        const d = rnd(2, 8);
        const c = rnd(1, 9 - d);
        const b = c + d;
        const twoDigit = Math.random() < 0.5;
        const qmin = Math.ceil((twoDigit ? 10 : 100) / d);
        const qmax = Math.floor((twoDigit ? 99 : 999) / d);
        if (qmax < qmin) continue;
        const a = d * rnd(qmin, qmax);
        const text = `${a}÷(${b}-${c})`;
        const ans = a / d;
        if (safeEval(text) !== ans) continue;
        return { text, ans };

      } else {
        /* 9) a÷(b+c)：括号内和为一位数（2~9，避免除以 1），a 按 d×q 构造保证整除 */
        const d = rnd(2, 9);
        const b = rnd(1, d - 1);
        const c = d - b;
        const twoDigit = Math.random() < 0.5;
        const qmin = Math.ceil((twoDigit ? 10 : 100) / d);
        const qmax = Math.floor((twoDigit ? 99 : 999) / d);
        if (qmax < qmin) continue;
        const a = d * rnd(qmin, qmax);
        const text = `${a}÷(${b}+${c})`;
        const ans = a / d;
        if (safeEval(text) !== ans) continue;
        return { text, ans };
      }
    }
    /* 兜底：one×(a±X) 形式，合法且约束都满足 */
    return { text: "3×(404+2)", ans: 1218 };
  }

  /* 固定顺序的 4 题：不加盐顺序，按用户要求展示 */
  function buildBlended(){
    /* 标签 10301~10304：计算题 · 递等式 */
    return [ makeBlend1(), makeBlend2(), makeBlend3(), makeBlend4() ]
      .map((q, i) => Object.assign({ tag: String(10301 + i) }, q));
  }

  /* ================= 4.在（）里填合适的数或单位（单位换算填空，共 3 题） =================
     质量：吨、千克、克；长度：千米、米、分米、厘米、毫米；时间：时、分、秒。
     题形：①大→小填数（3千米=（）米）②小→大填数（5000千克=（）吨）
           ③复合（120厘米=（）米（）分米）④填单位（1米=10（））。
     每题返回 { segs, ans }：segs 中的 null 表示一个空（），ans 为对应答案。 */

  /* 单位表：[名称, 换算成最小单位（毫米 / 克 / 秒）的倍数]，从大到小排列 */
  const MASS_U = [["吨", 1000000], ["千克", 1000], ["克", 1]];
  const LEN_U  = [["千米", 1000000], ["米", 1000], ["分米", 100], ["厘米", 10], ["毫米", 1]];
  const TIME_U = [["时", 3600], ["分", 60], ["秒", 1]];
  /* 单位 → 基准倍数（质量以克、长度以毫米、时间以秒为基准） */
  const UBASE = {};
  [...MASS_U, ...LEN_U, ...TIME_U].forEach(u => UBASE[u[0]] = u[1]);

  /* 各类单位表 */
  const UNIT_TABLE = { mass: MASS_U, len: LEN_U, time: TIME_U };

  /* 同类单位内所有进率 ≤ 1000 的两两组合 */
  function unitPairs(U){
    const out = [];
    for (let i = 0; i < U.length; i++)
      for (let j = i + 1; j < U.length; j++){
        const r = U[i][1] / U[j][1];
        if (r <= 1000) out.push({ big: U[i][0], small: U[j][0], ratio: r });
      }
    return out;
  }

  /* 复合换算时统一按基准倍数换算：[左式单位, 大单位, 更小单位] */
  const COMPOUND = {
    mass: [["克", "千克", "克"], ["千克", "吨", "千克"]],
    len:  [["厘米", "米", "分米"], ["分米", "米", "分米"], ["毫米", "厘米", "毫米"], ["米", "千米", "米"]],
    time: [["分", "时", "分"], ["秒", "分", "秒"]]
  };

  /* 生成一道换算填空（kind: "mass" | "len" | "time"） */
  function makeFillProblem(kind){
    const pairs = unitPairs(UNIT_TABLE[kind]);
    const comps = COMPOUND[kind];
    for (let t = 0; t < 100; t++){
      const type = rnd(1, 4);
      if (type === 1){                        /* 大 → 小，填数：3千米=（）米 */
        const p = pairs[rnd(0, pairs.length - 1)];
        const cap = kind === "time" ? 9 : Math.floor(9000 / p.ratio);  /* 时间换算数值不宜过大 */
        const v = rnd(1, Math.max(1, cap));
        return { segs: [`${v}${p.big}=`, null, `${p.small}`], ans: [String(v * p.ratio)] };
      }
      if (type === 2){                        /* 小 → 大，填数：5000千克=（）吨 */
        const p = pairs[rnd(0, pairs.length - 1)];
        const k = rnd(1, 9);
        return { segs: [`${p.ratio * k}${p.small}=`, null, `${p.big}`], ans: [String(k)] };
      }
      if (type === 3){                        /* 复合：120厘米=（）米（）分米 */
        const c = comps[rnd(0, comps.length - 1)];
        const r1 = UBASE[c[1]] / UBASE[c[0]]; /* 1 个大单位 = r1 个左式单位 */
        const r2 = UBASE[c[2]] / UBASE[c[0]]; /* 1 个更小单位 = r2 个左式单位 */
        const lim = r1 / r2;                  /* 更小单位最多取到 lim-1，避免进位 */
        const a = rnd(1, 9);
        const b = lim >= 1000 ? rnd(1, 9) * 100 : rnd(1, lim - 1);
        return { segs: [`${a * r1 + b * r2}${c[0]}=`, null, `${c[1]}`, null, `${c[2]}`],
                 ans: [String(a), String(b)] };
      }
      const p = pairs[rnd(0, pairs.length - 1)]; /* 填单位：1米=10（） */
      return { segs: [`1${p.big}=${p.ratio}`, null], ans: [p.small] };
    }
    return { segs: ["1吨=", null, "千克"], ans: ["1000"] };   /* 兜底 */
  }

  /* ================= 题库（可在本文件里直接编辑，也可导入 CSV 追加） =================
