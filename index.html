  /* 宽扁图片（如天平图、线段图）自动按整行宽度显示；
     图片实际高度不足预留行数时，收紧图片容器的留白，避免图片和选项之间空行太多 */
  function fitImgLayout(wrap, img, cell, customW, reserveLines){
    const apply = function(){
      if (!customW && img.naturalWidth >= 480 && img.naturalWidth >= img.naturalHeight * 2.5){
        img.classList.add("qimg-wide");
      }
      if (wrap.closest(".q-stem")) return;   /* 已指定图片位置时按图片实际高度排列 */
      const w = img.clientWidth || 0;
      if (!img.naturalWidth || !img.naturalHeight || !w) return;
      let lineH = 46;
      try{
        const v = parseFloat(getComputedStyle(cell).getPropertyValue("--line"));
        if (v > 0) lineH = v;
      }catch(e){}
      const h = w * img.naturalHeight / img.naturalWidth;
      const rounded = Math.max(lineH, Math.ceil((h - 1) / lineH) * lineH);
      const reserved = Math.max(1, reserveLines || 1) * lineH;
      wrap.style.minHeight = Math.min(reserved, rounded) + "px";
    };
    img.addEventListener("load", apply);
    if (img.complete) { apply(); setTimeout(apply, 0); }
  }

  /* 一组图片（同一位置）的容器：多图横排自动换行；单图按实际高度收紧留白 */
  function makeImgWrap(list, cell, opts){
    opts = opts || {};
    const wrap = document.createElement("div");
    wrap.className = "qimg-wrap";
    if (opts.lines) wrap.style.setProperty("--ni", opts.lines);
    if (list.length > 1){
      const group = document.createElement("div");
      group.className = "qimg-list" + (opts.wide ? " qimg-wide" : "");
      list.forEach(function(im){
        const img = document.createElement("img");
        img.className = "qimg";
        img.alt = "";
        applyImgWidth(img, im.w);
        loadImg(img, im.src);
        group.appendChild(img);
      });
      wrap.appendChild(group);
    } else {
      const img = document.createElement("img");
      img.className = "qimg" + (opts.wide ? " qimg-wide" : "");
      img.alt = "";
      /* 显式指定宽度时以指定值为准；宽幅插图未指定宽度时按整行宽度显示 */
      const customW = applyImgWidth(img, list[0].w);
      loadImg(img, list[0].src);
      fitImgLayout(wrap, img, cell, customW, opts.lines);
      wrap.appendChild(img);
    }
    return wrap;
  }

  /* 题干/小题文字 + 配图：每张图可单独设置位置（上/下/左/右）和宽度。
     按位置把相邻图片归成一组：第一组与文字并按位置摆放，其余组依次排在下方 */
  function appendLineWithImages(cell, line, imgs, opts){
    if (!imgs || !imgs.length){ cell.appendChild(line); return; }
    const groups = [];
    imgs.forEach(function(im){
      const last = groups[groups.length - 1];
      const align = im.align || "";
      /* 位置或对齐不同的图片不再并排，改成上下分组摆放 */
      if (last && last.pos === im.pos && last.align === align) last.items.push(im);
      else groups.push({ pos: im.pos || "", align: align, items: [im] });
    });
    const first = groups[0];
    const wrap = makeImgWrap(first.items, cell, opts);
    if (first.align) wrap.classList.add("img-align-" + first.align);
    if (first.pos){
      const stem = document.createElement("div");
      stem.className = "q-stem img-" + first.pos + ((first.pos === "left" || first.pos === "right") ? " media-row" : "");
      if (first.pos === "left" || first.pos === "top") stem.append(wrap, line);
      else stem.append(line, wrap);
      cell.appendChild(stem);
    } else {
      cell.appendChild(line);
      cell.appendChild(wrap);
    }
    groups.slice(1).forEach(function(g){
      const w = makeImgWrap(g.items, cell, opts);
      /* 对齐：优先用图片自身对齐；没单独设置时按位置靠左 / 靠右 */
      const a = g.align || (g.pos === "right" ? "right" : g.pos === "left" ? "left" : "");
      if (a) w.classList.add("img-align-" + a);
      cell.appendChild(w);
    });
  }

  /* 选择题单元格：题干（含答案空位）+ 配图 + 四个选项 */
  function makeChoiceCell(q){
    const cell = document.createElement("div");
    cell.className = "sitem";
    if (q.n) cell.style.setProperty("--n", q.n);

    const line = document.createElement("div");
    line.className = "stext";
    appendSegs(line, makeSegs(q.text), q.ans, 0, q.num);

    const choiceImgs = (q.imgs && q.imgs.length) ? q.imgs : (q.img ? [q.img] : []);
    const posList = q.imgPosList || [];
    const wList = q.imgWList || [];
    const aList = q.imgAlignList || [];
    appendLineWithImages(cell, line, choiceImgs.map(function(src, i){
      return { src: src, pos: posList[i] || "", w: wList[i] || "", align: aList[i] || "" };
    }), { wide: !!(q.imgWide || q.optionsInImg), lines: q.imgLines });

    /* 选择题也可以带统计表：题干下方、选项上方渲染 */
    appendTableGroup(cell, q.tables || [], q.tableLayout);

    /* 表格下方文字（题干 → 表格 → 这段 → 选项） */
    if (q.textAfter){
      const after = document.createElement("div");
      after.className = "stext";
      appendTextWithBreaks(after, q.textAfter, null);
      cell.appendChild(after);
    }

    /* 选项已经画在题目图片里时（optionsInImg），不再生成 A/B/C/D 选项区 */
    if (!q.optionsInImg){
      const opts = document.createElement("div");
      opts.className = "options";
      if ((q.optionImgs || []).some(Boolean)) opts.classList.add("has-imgs");
      q.options.forEach((o, i) => {
        const d = document.createElement("div");
        d.className = "opt";
        const optImg = (q.optionImgs || [])[i];
        if (optImg){
          const img = document.createElement("img");
          img.className = "opt-img";
          img.alt = "";
          loadImg(img, optImg);
          d.appendChild(img);
          const m = String(o).match(/^([A-D])[.．、]\s*(.*)$/);
          const label = (m ? m[1] : String.fromCharCode(65 + i)) + ".";
          const rest = m ? m[2] : "";
          const lab = document.createElement("span");
          lab.className = "opt-label";
          lab.textContent = label + (rest ? " " + rest : "");
          d.appendChild(lab);
        } else {
          d.textContent = o;
        }
        opts.appendChild(d);
      });
      cell.appendChild(opts);
    }

    return cell;
  }

  /* 表格单元格内容：支持 Word 导入的图片（![](data:…)）、
     圆圈内答案 [[○>]]（显示答案时压在 ○ 内）以及 [[br]] 换行等标记 */
  function appendTableCell(td, text){
    const s = String(text == null ? "" : text);
    const re = /!\[[^\]]*\]\(\s*([^)\s]+)\s*\)|\[\[○([^\]]*)\]\]/g;
    let last = 0, m;
    while ((m = re.exec(s)) !== null){
      if (m.index > last) appendTextWithBreaks(td, s.slice(last, m.index), null);
      if (m[1]){
        const img = document.createElement("img");
        img.className = "tbl-img";
        img.alt = "";
        loadImg(img, m[1]);
        td.appendChild(img);
      } else {
        /* 和正文里的 ○ 空位同一套结构：答案绝对定位在圆圈中心 */
        const group = document.createElement("span");
        group.className = "blank circle";
        const glyph = document.createElement("span");
        glyph.className = "glyph";
        glyph.textContent = "○";
        const a = document.createElement("span");
        a.className = "ans circle-ans";
        a.dataset.ans = m[2] || "";
        a.textContent = showAnswer ? a.dataset.ans : "";
        group.append(glyph, a);
        td.appendChild(group);
      }
      last = re.lastIndex;
    }
    if (last < s.length) appendTextWithBreaks(td, s.slice(last), null);
  }

  /* 把一道 table 描述渲染成 &lt;table&gt;；
     t.plain = 无边框（如统计原始数据的“正”字表）；
     t.title / t.date = 表格上方居中标题和右上角日期填写栏 */
  function buildTable(t){
    const tbl = document.createElement("table");
    tbl.className = "fill-table" + (t.plain ? " plain" : "") + (t.center ? " center" : "")
      + (t.align === "left" ? " align-left" : t.align === "right" ? " align-right" : "");
    t.rows.forEach((row, r) => {
      const tr = document.createElement("tr");
      row.forEach((c, col) => {
        const td = document.createElement("td");
        appendTableCell(td, c);
        if (t.ans && t.ans[r] && t.ans[r][col] !== c){
          td.className = "table-ans";
          td.dataset.ans = t.ans[r][col];
          td.dataset.orig = c;   /* 隐藏答案时还原题目原文 */
          if (showAnswer){
            td.replaceChildren();
            appendTableCell(td, td.dataset.ans);
            td.classList.add("ans-shown");
          }
        }
        tr.appendChild(td);
      });
      tbl.appendChild(tr);
    });
    if (!t.title && !t.date) return tbl;
    const wrap = document.createElement("div");
    wrap.className = "table-block";
    const head = document.createElement("div");
    head.className = "table-head";
    const title = document.createElement("span");
    title.className = "table-title";
    title.textContent = t.title || "";
    const date = document.createElement("span");
    date.className = "table-date";
    date.textContent = t.date || "";
    head.append(title, date);
    wrap.append(head, tbl);
    return wrap;
  }

  /* 同一位置的多张表格：tableLayout === "row" 时横排并排，否则逐张上下排列。
     只合并同一位置的表格（题干后 / 同一条小题后），不会打乱文字顺序 */
  function appendTableGroup(parent, list, layout){
    if (!list || !list.length) return;
    if (list.length > 1 && layout === "row"){
      const row = document.createElement("div");
      row.className = "tables-row";
      list.forEach(t => row.appendChild(buildTable(t)));
      parent.appendChild(row);
    } else {
      list.forEach(t => parent.appendChild(buildTable(t)));
    }
  }

  /* 解决问题 / 操作题单元格：题干 + 配图 + 表格 + 小题 + 解答过程（显示答案时才出现） */
  function makeAppCell(q){
    const cell = document.createElement("div");
    cell.className = "aitem";
    if (q.n) cell.style.setProperty("--n", q.n);

    /* 题干与小题里的「（）」按顺序对应题库里的答案，和填空题一样在括号内显示；
       多出来的答案（如只有表格、没有括号的题）在下方答案区显示 */
    const ansArr = (Array.isArray(q.ans) ? q.ans : (q.ans ? [q.ans] : [])).map(s => String(s == null ? "" : s));
    let ai = 0;

    const text = document.createElement("div");
    text.className = "atext";
    ai = appendSegs(text, makeFillSegs(q.num + ". " + q.text, false, false, false), ansArr, ai, null);

    const appImgs = (q.imgs && q.imgs.length) ? q.imgs : (q.img ? [q.img] : []);
    const imgPosList = q.imgPosList || [];
    const imgWList = q.imgWList || [];
    const imgAlignList = q.imgAlignList || [];
    const imgAfter = Array.isArray(q.imgAfterSub) ? q.imgAfterSub : [];
    /* 按 imgAfterSub 分组：0=题干；N=第 N 条小题后；每组内保留每张图自己的位置/宽度/对齐 */
    const imgGroups = new Map();
    appImgs.forEach(function(src, i){
      const g = Math.max(0, parseInt(imgAfter[i], 10) || 0);
      if (!imgGroups.has(g)) imgGroups.set(g, []);
      imgGroups.get(g).push({ src: src, pos: imgPosList[i] || "", w: imgWList[i] || "", align: imgAlignList[i] || "" });
    });
    const mainImgs = imgGroups.get(0) || [];
    const imgOpts = { wide: !!q.imgWide, lines: q.imgLines };

    /* 题干与题干图片：每张图按自己的位置（上/下/左/右）和宽度摆放 */
    appendLineWithImages(cell, text, mainImgs, imgOpts);

    /* 操作题/解决问题常带统计表；支持单表(table+tableAns)或多表(tables)
       每张表默认在 subs 之前渲染；若 t.afterSub = N，则在第 N 条小题后渲染 */
    const tables = q.tables || (q.table ? [{ rows: q.table, ans: q.tableAns }] : []);
    let preIdx = 0;
    tables.forEach((t, idx) => { if (!t.afterSub) preIdx = idx + 1; });
    appendTableGroup(cell, tables.slice(0, preIdx), q.tableLayout);
    /* 表格下方文字：题干 → 表格 → 这段 → 小题 */
    if (q.textAfter){
      const after = document.createElement("div");
      after.className = "atext";
      ai = appendSegs(after, makeFillSegs(q.textAfter, false, false, false), ansArr, ai, null);
      cell.appendChild(after);
    }
    (q.subs || []).forEach((s, i) => {
      const d = document.createElement("div");
      d.className = "asub";
      ai = appendSegs(d, makeFillSegs(s, false, false, false), ansArr, ai, null);
      /* 属于这条小题的图片：紧跟在小题文字后、该小题的表格前；每张图可单独设置位置/宽度 */
      const subImgs = imgGroups.get(i + 1);
      if (subImgs && subImgs.length) appendLineWithImages(cell, d, subImgs, imgOpts);
      else cell.appendChild(d);
      appendTableGroup(cell, tables.slice(preIdx).filter(t => t.afterSub === i + 1), q.tableLayout);
    });
    /* 小题数量不够时，多出来的图片分组统一放在最后，避免丢图 */
    imgGroups.forEach(function(list, g){
      if (g > (q.subs || []).length && list.length) cell.appendChild(makeImgWrap(list, cell, imgOpts));
    });
    appendTableGroup(cell, tables.slice(preIdx).filter(t => !t.afterSub), q.tableLayout);

    /* 答案区：没填进括号的剩余答案 + 解题过程 + 解题表格 + 答案图片，只在“显示答案”时出现 */
    const restAns = ansArr.slice(ai).filter(s => s.trim());
    const solArr = q.sol || [];
    const solTables = (Array.isArray(q.solTables) ? q.solTables : []).filter(t => t && Array.isArray(t.rows) && t.rows.length);
    const ansImgs = Array.isArray(q.ansImg) ? q.ansImg : (q.ansImg ? [q.ansImg] : []);
    if (restAns.length || solArr.length || solTables.length || ansImgs.length){
      const sol = document.createElement("div");
      sol.className = "sol";
      sol.style.display = showAnswer ? "block" : "none";
      if (restAns.length){
        const d = document.createElement("div");
        d.className = "sol-ans";
        appendTextWithBreaks(d, "答案：" + restAns.join("；"), null);
        sol.appendChild(d);
      }
      solArr.forEach(s => {
        const d = document.createElement("div");
        appendTextWithBreaks(d, s, null);
        sol.appendChild(d);
      });
      /* 解题表格：内容本身就是答案；可竖排 / 横排，可无边框 */
      if (solTables.length){
        const list = solTables.map(t => Object.assign({}, t, {
          plain: q.solTablesPlain ? true : !!t.plain
        }));
        appendTableGroup(sol, list, q.solTableLayout);
      }
      ansImgs.forEach(src => {
        const img = document.createElement("img");
        img.className = "sol-img" + (ansImgs.length > 1 ? " sol-img-multi" : "");
        img.alt = "";
        loadImg(img, src);
        sol.appendChild(img);
      });
      cell.appendChild(sol);
    }

    return cell;
  }

  /* 生成一道题的 DOM（eq + 答案占位）；计算题也可以带表格排版 */
  function makeCell(q, cls){
    const cell = document.createElement("div");
    cell.className = cls;

    const tables = q.tables || (q.table ? [{ rows: q.table, ans: q.tableAns, align: q.tableAlign }] : []);
    if (tables.length) cell.classList.add("has-table");

    const eq = document.createElement("span");
    eq.className = "eq";
    appendTextWithBreaks(eq, q.text, null);

    /* 递等式题（如「24×3×2」）题干本身没有等号，只在显示答案时补一个，
       避免隐藏答案时多出“=”，显示答案时又和得数连在一起 */
    const eqShow = document.createElement("span");
    eqShow.className = "eq eq-show";
    eqShow.textContent = /[=＝]\s*$/.test(String(q.text || "")) ? "" : "=";
    eqShow.hidden = !showAnswer;

    const ans = document.createElement("span");
    ans.className = "ans";
    ans.dataset.ans = q.ans == null ? "" : q.ans;
    ans.textContent = showAnswer ? ans.dataset.ans : "";

    /* 只有表格、没有算式文字时不再显示孤零零的“= + 答案” */
    if (String(q.text || "").trim() || !tables.length) cell.append(eq, eqShow, ans);

    if (tables.length){
      appendTableGroup(cell, tables, q.tableLayout);
      if (q.textAfter){
        const after = document.createElement("div");
        after.className = "calc-after";
        appendTextWithBreaks(after, q.textAfter, null);
        cell.appendChild(after);
      }
    }
    return cell;
  }

  /* 隐藏板块/题目后，标题里的序号自动重排：
     renumberCn 处理大类标题「三：选择题。」→「二：选择题。」；
     renumberLead 处理小题标题「2.用竖式计算。」→「1.用竖式计算。」 */
  const CN_ORDINAL = ["", "一", "二", "三", "四", "五", "六", "七", "八", "九", "十"];
  function renumberCn(text, n){
    return String(text).replace(/^(\s*)[一二三四五六七八九十]+(\s*[、：:．.])/,
      (m, lead, sep) => lead + (CN_ORDINAL[n] || n) + sep);
  }
  function renumberLead(text, n){
    return String(text).replace(/^(\s*)\d+(\s*[、：:．.])/,
      (m, lead, sep) => lead + n + sep);
  }

  function render(){
    const box = document.getElementById("problems");
    const vbox = document.getElementById("vproblems");
    const bbox = document.getElementById("bproblems");
    const c4box = document.getElementById("cmpproblems");
    const cbox = document.getElementById("cproblems");
    const fbox = document.getElementById("fillbank");
    const sbox = document.getElementById("sproblems");
    const obox = document.getElementById("oproblems");
    const wbox = document.getElementById("wproblems");
    box.innerHTML = "";
    vbox.innerHTML = "";
    bbox.innerHTML = "";
    c4box.innerHTML = "";
    cbox.innerHTML = "";
    fbox.innerHTML = "";
    sbox.innerHTML = "";
    obox.innerHTML = "";
    wbox.innerHTML = "";

    /* --- 动态题号集合：从导入标签推断各板块要渲染的具体题号。
       规则：扫描所有导入项，收集该板块出现过的题号（含占位符），去重升序；
       有导入就只渲染这些题号（可非连续，如 1/3/5）；无导入则用默认连续序列 --- */
    const imported = readImported();
    const hideBuiltin = hideBuiltinOn();

    /* --- 板块显隐控制：9xxxx 控制标签（不是题目） ---
       90000 = 只保留本次导入过题目的板块，其余整体隐藏
       9A000 = 隐藏指定大类（A：1计算 2填空 3选择 4操作 5解决）
       每次渲染先复位，避免上一次导入的隐藏状态残留 */
    const SECTION_IDS = [
      "cat-100", "title-101", "problems", "title-102", "vproblems",
      "title-103", "bproblems", "b-gap",
      "title-104", "cmpproblems",
      "cat-200", "title-201", "cproblems", "fillbank",
      "cat-300", "sproblems", "cat-400", "oproblems", "cat-500", "wproblems",
    ];
    SECTION_IDS.forEach(id => { const el = document.getElementById(id); if (el) el.hidden = false; });

    /* 板块/槽位显隐：模板页默认全部显示导入题；手动「出题范围」启用时以勾选为准。
       90000 = 只保留本次导入过题目的板块；9A000 = 隐藏指定大类；9AXX0 = 隐藏某个 slot */
    const { hiddenClass, hiddenSlot } = resolveViewState(imported);
    const slotHidden = (a, slot) => hiddenSlot.has(a + "-" + slot);
    const idxSet = (regexp, extractor) => {
      const s = new Set();
      imported.forEach(it => (it.tags || []).forEach(t => {
        if (regexp.test(t)) { const v = extractor(t); if (v != null && v > 0) s.add(v); }
      }));
      return s.size ? [...s].sort((a, b) => a - b) : null;
    };
    const range = (a, b) => { const out = []; for (let i = a; i <= b; i++) out.push(i); return out; };
    const idx101 = idxSet(/^101\d{2}$/, t => parseInt(t.slice(3))) || range(1, 24);
    const idx102 = idxSet(/^102\d{2}$/, t => parseInt(t.slice(3))) || range(1, 4);
    const idx103 = idxSet(/^103\d{2}$/, t => parseInt(t.slice(3))) || range(1, 4);
    const idx104 = idxSet(/^104\d{2}$/, t => parseInt(t.slice(3))) || range(1, 6);

    /* 填空题 slot 01：201XX，XX 为小题号。有导入按导入题号渲染，无导入默认 1/2/3 */
    const idxFill01 = idxSet(/^201\d{2}$/, t => parseInt(t.slice(3))) || [1, 2, 3];

    /* 填空题 slot 02~NN：2NNXX，每个 slot 维护一个导入题号集合。
       slot 2~10 默认各渲染第 1 题（有内置生成器）；有导入则只渲染导入的题号 */
    const slotIdxMap = new Map();   /* slotNum → Set<idx> */
    imported.forEach(it => (it.tags || []).forEach(t => {
      const m = /^2(\d{2})(\d{2})$/.exec(t);
      if (!m) return;
      const slot = parseInt(m[1]), idx = parseInt(m[2]);
      if (slot >= 2 && idx > 0) {
        if (!slotIdxMap.has(slot)) slotIdxMap.set(slot, new Set());
        slotIdxMap.get(slot).add(idx);
      }
    }));
    /* slot 2~10 默认存在；导入的 slot 也加入，并补到最大 slot 保证连续 */
    const fillSlotSet = new Set();
    for (let s = 2; s <= 10; s++) fillSlotSet.add(s);
    slotIdxMap.forEach((_, s) => fillSlotSet.add(s));
    if (slotIdxMap.size > 0) {
      const mx = Math.max(...slotIdxMap.keys());
      for (let s = 2; s <= mx; s++) fillSlotSet.add(s);
    }

    /* 选择题 / 操作题 / 解决问题：3NNXX / 4NNXX / 5NNXX，同填空 slot 02+ 结构。
       slot 1~5 默认各 1 题（有内置题库）；有导入则只渲染导入的题号 */
    const choiceSlotIdxMap = new Map();
    const opSlotIdxMap = new Map();
    const appSlotIdxMap = new Map();
    imported.forEach(it => (it.tags || []).forEach(t => {
      const m3 = /^3(\d{2})(\d{2})$/.exec(t);
      if (m3 && parseInt(m3[2]) > 0) {
        const s = parseInt(m3[1]);
        if (!choiceSlotIdxMap.has(s)) choiceSlotIdxMap.set(s, new Set());
        choiceSlotIdxMap.get(s).add(parseInt(m3[2]));
      }
      const m4 = /^4(\d{2})(\d{2})$/.exec(t);
      if (m4 && parseInt(m4[2]) > 0) {
        const s = parseInt(m4[1]);
        if (!opSlotIdxMap.has(s)) opSlotIdxMap.set(s, new Set());
        opSlotIdxMap.get(s).add(parseInt(m4[2]));
      }
      const m5 = /^5(\d{2})(\d{2})$/.exec(t);
      if (m5 && parseInt(m5[2]) > 0) {
        const s = parseInt(m5[1]);
        if (!appSlotIdxMap.has(s)) appSlotIdxMap.set(s, new Set());
        appSlotIdxMap.get(s).add(parseInt(m5[2]));
      }
    }));
    const choiceSlotSet = new Set();
    for (let s = 1; s <= 5; s++) choiceSlotSet.add(s);
    choiceSlotIdxMap.forEach((_, s) => choiceSlotSet.add(s));
    if (choiceSlotIdxMap.size > 0) {
      const mx = Math.max(...choiceSlotIdxMap.keys());
      for (let s = 1; s <= mx; s++) choiceSlotSet.add(s);
    }
    const opSlotSet = new Set();
    for (let s = 1; s <= 2; s++) opSlotSet.add(s);   /* 操作题默认 2 个 slot */
    opSlotIdxMap.forEach((_, s) => opSlotSet.add(s));
    if (opSlotIdxMap.size > 0) {
      const mx = Math.max(...opSlotIdxMap.keys());
      for (let s = 1; s <= mx; s++) opSlotSet.add(s);
    }
    const appSlotSet = new Set();
    for (let s = 1; s <= 5; s++) appSlotSet.add(s);
    appSlotIdxMap.forEach((_, s) => appSlotSet.add(s));
    if (appSlotIdxMap.size > 0) {
      const mx = Math.max(...appSlotIdxMap.keys());
      for (let s = 1; s <= mx; s++) appSlotSet.add(s);
    }
    /* 题目题面说明覆盖：按末尾 00 结尾的标签（10000/10100/20100/30000/40000/50000 等）查询导入题库，
       有则替换默认标题，没有就保持 HTML 里的硬编码文本；多条则随机选一条 */
    const titles = [
      ["title-00000", "00000", "苏教版三上数学作业设计"],
      ["cat-100", "10000", "一：计算题。"],
      ["title-101", "10100", "1.直接写出得数。"],
      ["title-102", "10200", "2.用竖式计算。"],
      ["title-103", "10300", "3.递等式计算。"],
      ["title-104", "10400", "4.算一算，比一比。"],
      ["cat-200", "20000", "二：填空。"],
      ["title-201", "20100", "1.在（）里填合适的数或单位。"],
      ["cat-300", "30000", "三：选择题。"],
      ["cat-400", "40000", "四：操作题。"],
      ["cat-500", "50000", "五：解决问题。"],
    ];
    /* 可见大类 / 可见计算小题，用于标题序号重排（隐藏后自动 一/二/三…、1./2./3. 连续） */
    const visibleClasses = ["1", "2", "3", "4", "5"].filter(a => !hiddenClass.has(a));
    const calcVisibleSlots = [1, 2, 3, 4].filter(s => !slotHidden("1", s));
    /* 填空第 1 题若是整题导入（没有 20100 小题说明），它自带题号；
       此时隐藏通用的「1.在（）里填合适的数或单位。」，避免标题与题目对不上 */
    const fill01SelfNumbered =
      imported.some(it => (it.tags || []).includes("20101")) &&
      !imported.some(it => (it.tags || []).includes("20100"));
    titles.forEach(([id, tag, fb]) => {
      const el = document.getElementById(id);
      if (!el) return;
      if (id === "title-201" && fill01SelfNumbered){ el.hidden = true; return; }
      let text = pickTitle(tag, fb);
      const classTag = /^([1-5])0000$/.exec(tag);
      if (classTag){
        const pos = visibleClasses.indexOf(classTag[1]);
        if (pos >= 0) text = renumberCn(text, pos + 1);
      } else if (/^10[1-4]00$/.test(tag)){
        const slot = parseInt(tag.slice(1, 3), 10);
        const pos = calcVisibleSlots.indexOf(slot);
        if (pos >= 0) text = renumberLead(text, pos + 1);
      }
      el.textContent = text;
    });
    /* 一：计算题。每道题先看精确标签，没有再看整类池，最后内置生成器；
       题号由导入集合决定（可非连续），无导入用默认 1..24 / 1..4 / 1..4 */
    if (!hiddenClass.has("1")) {
    /* 口算：默认 24 题（build）。超出部分按 pos%6 循环 6 种题型即时生成，
       避免 built101[pos % 24] 导致后 24 题与前 24 题完全重复 */
    const GEN101 = [makeMul, makeMulAdd, makeDiv2, makeDiv3, makeDivTens, makeDivThousand];
    const pool101 = classPool("101");
    const built101 = build();
    if (!slotHidden("1", 1)){
    idx101.forEach((idx, pos) => {
      const tag = "101" + String(idx).padStart(2, "0");
      const imp = pickByTag(tag) || pool101();
      if (hideBuiltin && !imp) return;
      const q = pos < built101.length ? built101[pos] : GEN101[pos % GEN101.length]();
      box.appendChild(makeCell(toCalcItem(imp || q, tag), "item"));
    });
    }
    /* 竖式：默认 4 题。超出部分按 中间0/末尾0/无0 循环即时生成 */
    const GEN102 = [makeMulMidZero, makeMulEndZero, makeMulNoZero];
    const pool102 = classPool("102");
    const built102 = buildVertical();
    if (!slotHidden("1", 2)){
    idx102.forEach((idx, pos) => {
      const tag = "102" + String(idx).padStart(2, "0");
      const imp = pickByTag(tag) || pool102();
      if (hideBuiltin && !imp) return;
      const q = pos < built102.length ? built102[pos] : GEN102[pos % GEN102.length]();
      vbox.appendChild(makeCell(toCalcItem(imp || q, tag), "vitem"));
    });
    }
    /* 递等式：默认 4 题。超出部分按 4 种混合题型循环即时生成 */
    const GEN103 = [makeBlend1, makeBlend2, makeBlend3, makeBlend4];
    const pool103 = classPool("103");
    const built103 = buildBlended();
    if (!slotHidden("1", 3)){
    idx103.forEach((idx, pos) => {
      const tag = "103" + String(idx).padStart(2, "0");
      const imp = pickByTag(tag) || pool103();
      if (hideBuiltin && !imp) return;
      const q = pos < built103.length ? built103[pos] : GEN103[pos % GEN103.length]();
      bbox.appendChild(makeCell(toCalcItem(imp || q, tag), "item"));
    });
    }
    /* 算一算，比一比：3 列；第一行是递等式（不加“=”），空 2 行后写第二行竖式，
       竖式下方再空 3 行接填空。导入 10401~10406 时按题号顺序两两一组放进同一列 */
    const DEFAULT_CMP104 = [
      { text: "24×3×2", ans: "144" },  { text: "24×6=", ans: "144" },
      { text: "105×2×4", ans: "840" }, { text: "105×8=", ans: "840" },
      { text: "320×3×3", ans: "2880" }, { text: "320×9=", ans: "2880" },
    ];
    if (!slotHidden("1", 4)){
    const cmpItems = idx104.map((idx, pos) => {
      const tag = "104" + String(idx).padStart(2, "0");
      const imp = pickByTag(tag);
      if (hideBuiltin && !imp) return null;
      const q = imp || DEFAULT_CMP104[pos % DEFAULT_CMP104.length];
      return toCalcItem(q, tag);
    }).filter(Boolean);
    for (let i = 0; i < cmpItems.length; i += 2){
      const col = document.createElement("div");
      col.className = "cmpcol";
      col.appendChild(makeCell(cmpItems[i], "item cmprow"));
      const gap2 = document.createElement("div");
      gap2.className = "cmpgap2";        /* 递等式与竖式之间空 2 行 */
      col.appendChild(gap2);
      if (cmpItems[i + 1]) col.appendChild(makeCell(cmpItems[i + 1], "item cmprow"));
      const gap3 = document.createElement("div");
      gap3.className = "cmpgap3";        /* 竖式之后到填空之间空 3 行 */
      col.appendChild(gap3);
      c4box.appendChild(col);
    }
    }
    }
    /* 填空第 1 题（slot 01）：题号由导入集合决定，无导入默认 1/2/3；
       用渲染位置 pos 循环 mass/len/time，保证非连续题号时单位仍均匀 */
    if (!hiddenClass.has("2")) {
    const pool201 = classPool("201");
    if (!slotHidden("2", 1)){
    idxFill01.forEach((idx, pos) => {
      const tag = "201" + String(idx).padStart(2, "0");
      /* makeFillByTag 只从导入题库的分类池取题，属于导入来源 */
      const imp = pickByTag(tag) || pool201() || makeFillByTag(pos);
      let item = imp ? toFillItem(Object.assign({ tag }, imp)) : null;
      if (!item) { if (hideBuiltin) return; item = makeFill01Item(pos, tag); }
      if (item) {
        item.tag = tag;
        /* 通用小题标题隐藏时，由题目自己带上 1. / 2. … 的题号；
           有 20100 题面说明时，题号归标题，题目正文不再重复编号 */
        if (fill01SelfNumbered) item.num = pos + 1;
        else delete item.num;
        cbox.appendChild(makeFillCell(item));
      }
    });
    }
    /* 填空题 slot 02~NN：每个 slot 按导入的题号集合渲染；无导入默认只渲染第 1 题。
       slot 2~10 第 01 题有内置生成器，第 02 题及以后无导入（含占位符）则不渲染 */
    const genBySlot = {
      2: makeWordFill5,  3: makeWordFill6,  4: makeWordFill7,  5: makeWordFill8,
      6: makeWordFill9,  7: makeWordFill10,
      8: () => ({ ...WORD_FILL_QUESTIONS[0], num: 8 }),
      9: () => ({ ...WORD_FILL_QUESTIONS[1], num: 9 }),
      10: () => ({ ...WORD_FILL_QUESTIONS[2], num: 10 }),
    };
    const sortedFillSlots = [...fillSlotSet].sort((a, b) => a - b);
    /* 填空第 1 题在标题里编号，若它被隐藏，下面的小题从 1 开始重新编号 */
    /* 隐藏内置题时，若填空第 1 题没有任何导入来源，它会被整块收起，
       此时后续小题要从 1 开始编号，避免出现「2.」开头的空号 */
    const hasFill01 = imported.some(it => (it.tags || []).some(t =>
      /^201\d{2}$/.test(t) || t === "201" || FILL01_TAGS.includes(t)));
    let fillNo = (slotHidden("2", 1) || (hideBuiltin && !hasFill01)) ? 1 : 2;
    sortedFillSlots.forEach(slotNum => {
      if (slotHidden("2", slotNum)) return;
      const idxs = slotIdxMap.has(slotNum)
        ? [...slotIdxMap.get(slotNum)].sort((a, b) => a - b)
        : [1];
      /* 该 slot 的题面说明（2NN00）：有导入标题时先显示标题，
         标题自带 1、2、3… 编号，标题下的小题不再单独编号 */
      const slotTitleTag = "2" + String(slotNum).padStart(2, "0") + "00";
      const slotTitle = pickTitle(slotTitleTag, "");
      const slotCells = [];
      idxs.forEach(idx => {
        const tag = "2" + String(slotNum).padStart(2, "0") + String(idx).padStart(2, "0");  /* 2NNXX */
        const imp = pickByTag(tag);
        let item;
        if (imp) {
          item = toFillItem(Object.assign({ tag }, imp));
        } else if (!hideBuiltin && idx === 1 && genBySlot[slotNum]) {
          item = toFillItem(Object.assign({ tag }, genBySlot[slotNum]()));
        } else {
          item = null;   /* 非首题、无导入 → 不渲染 */
        }
        if (item) {
          item.tag = tag;
          if (slotTitle) delete item.num;
          else item.num = fillNo++;
          slotCells.push(makeFillCell(item));
        }
      });
      if (slotCells.length){
        if (slotTitle){
          const titleEl = document.createElement("div");
          titleEl.className = "section-title fill-slot-title";
          titleEl.dataset.tag = slotTitleTag;
          titleEl.textContent = slotTitle;
          /* 标题 + 两列小题组成一个块，与填空第 1 题的两列排版一致 */
          const block = document.createElement("div");
          block.className = "fill-slot-block";
          const grid = document.createElement("div");
          grid.className = "fill-slot-grid";
          slotCells.forEach(cell => grid.appendChild(cell));
          block.appendChild(titleEl);
          block.appendChild(grid);
          fbox.appendChild(block);
        } else {
          slotCells.forEach(cell => fbox.appendChild(cell));
        }
      }
    });
    }
    /* 三：选择题（3NNXX）；四：操作题（4NNXX）；五：解决问题（5NNXX）。
       每个 slot 按导入题号集合渲染；slot 1~5 第 01 题有内置题库，第 02 题及以后无导入则跳过 */
    if (!hiddenClass.has("3")) {
    const built30 = CHOICE_QUESTIONS;
    const sortedChoiceSlots = [...choiceSlotSet].sort((a, b) => a - b);
    let choiceNo = 0;
    sortedChoiceSlots.forEach(slotNum => {
      if (slotHidden("3", slotNum)) return;
      const idxs = choiceSlotIdxMap.has(slotNum)
        ? [...choiceSlotIdxMap.get(slotNum)].sort((a, b) => a - b)
        : [1];
      idxs.forEach(idx => {
        const tag = "3" + String(slotNum).padStart(2, "0") + String(idx).padStart(2, "0");
        const imp = pickByTag(tag);
        let cellText;
        if (imp) {
          cellText = toChoiceItem(imp, slotNum);
        } else if (!hideBuiltin && idx === 1 && built30[slotNum - 1]) {
          cellText = Object.assign({}, built30[slotNum - 1], { tag, num: slotNum });
        } else {
          return;   /* 非首题、无导入 → 跳过 */
        }
        cellText.num = ++choiceNo;   /* 隐藏题目后按实际显示顺序重新编号 */
        sbox.appendChild(makeChoiceCell(cellText));
      });
    });
    }
    if (!hiddenClass.has("4")) {
    const built40 = OPERATION_QUESTIONS;
    const sortedOpSlots = [...opSlotSet].sort((a, b) => a - b);
    let opNo = 0;
    sortedOpSlots.forEach(slotNum => {
      if (slotHidden("4", slotNum)) return;
      const idxs = opSlotIdxMap.has(slotNum)
        ? [...opSlotIdxMap.get(slotNum)].sort((a, b) => a - b)
        : [1];
      idxs.forEach(idx => {
        const tag = "4" + String(slotNum).padStart(2, "0") + String(idx).padStart(2, "0");
        const imp = pickByTag(tag);
        let cellText;
        if (imp) {
          cellText = toAppItem(imp, slotNum);
        } else if (!hideBuiltin && idx === 1 && built40[slotNum - 1]) {
          cellText = Object.assign({}, built40[slotNum - 1], { tag, num: slotNum });
        } else {
          return;
        }
        cellText.num = ++opNo;   /* 隐藏题目后按实际显示顺序重新编号 */
        obox.appendChild(makeAppCell(cellText));
      });
    });
    }
    if (!hiddenClass.has("5")) {
    const built50 = APP_QUESTIONS;
    const sortedAppSlots = [...appSlotSet].sort((a, b) => a - b);
    let appNo = 0;
    sortedAppSlots.forEach(slotNum => {
      if (slotHidden("5", slotNum)) return;
      const idxs = appSlotIdxMap.has(slotNum)
        ? [...appSlotIdxMap.get(slotNum)].sort((a, b) => a - b)
        : [1];
      idxs.forEach(idx => {
        const tag = "5" + String(slotNum).padStart(2, "0") + String(idx).padStart(2, "0");
        const imp = pickByTag(tag);
        let cellText;
        if (imp) {
          cellText = toAppItem(imp, slotNum);
        } else if (!hideBuiltin && idx === 1 && built50[slotNum - 1]) {
          cellText = Object.assign({}, built50[slotNum - 1], { tag, num: slotNum });
        } else {
          return;
        }
        cellText.num = ++appNo;   /* 隐藏题目后按实际显示顺序重新编号 */
        wbox.appendChild(makeAppCell(cellText));
      });
    });
    }
    /* 开启「隐藏内置题」后，跳过内置题会让一些板块变空，这里把空标题一并收起 */
    if (hideBuiltin){
      const hideIfEmpty = (titleId, boxIds) => {
        const boxes = boxIds.map(id => document.getElementById(id)).filter(Boolean);
        const empty = boxes.every(b => b.childElementCount === 0);
        if (!empty) return;
        const t = titleId && document.getElementById(titleId);
        if (t) t.hidden = true;
        boxes.forEach(b => { b.hidden = true; });
        if (titleId === "title-103"){
          const gap = document.getElementById("b-gap");
          if (gap) gap.hidden = true;
        }
      };
      hideIfEmpty("title-101", ["problems"]);
      hideIfEmpty("title-102", ["vproblems"]);
      hideIfEmpty("title-103", ["bproblems"]);
      hideIfEmpty("title-104", ["cmpproblems"]);
      hideIfEmpty("title-201", ["cproblems"]);
      ["fillbank", "sproblems", "oproblems", "wproblems"].forEach(id => {
        const el = document.getElementById(id);
        if (el && el.childElementCount === 0) el.hidden = true;
      });

      const catEmpty = (catId, ids) => {
        const anyVisible = ids.some(id => {
          const el = document.getElementById(id);
          return el && !el.hidden;
        });
        if (!anyVisible){
          const c = document.getElementById(catId);
          if (c) c.hidden = true;
        }
      };
      catEmpty("cat-100", ["title-101", "title-102", "title-103", "title-104"]);
      catEmpty("cat-200", ["title-201", "fillbank"]);
      catEmpty("cat-300", ["sproblems"]);
      catEmpty("cat-400", ["oproblems"]);
      catEmpty("cat-500", ["wproblems"]);

      /* 大类被收起后，剩余大类的序号重新连续编号（一、二、三…） */
      let catNo = 0;
      ["cat-100", "cat-200", "cat-300", "cat-400", "cat-500"].forEach(id => {
        const el = document.getElementById(id);
        if (el && !el.hidden){
          catNo++;
          el.textContent = renumberCn(el.textContent, catNo);
        }
      });
    }

    /* 按控制标签隐藏整块板块（含大类标题、小题标题、题目容器） */
    const HIDE_IDS = {
      "1": ["cat-100", "title-101", "problems", "title-102", "vproblems", "title-103", "bproblems", "b-gap", "title-104", "cmpproblems"],
      "2": ["cat-200", "title-201", "cproblems", "fillbank"],
      "3": ["cat-300", "sproblems"],
      "4": ["cat-400", "oproblems"],
      "5": ["cat-500", "wproblems"],
    };
    hiddenClass.forEach(a => (HIDE_IDS[a] || []).forEach(id => {
      const el = document.getElementById(id);
      if (el) el.hidden = true;
    }));
    /* 槽位级隐藏：计算四个小题和填空第 1 题自带标题/容器，需要一并隐藏；
       填空 slot 2~10 / 选择 / 操作 / 解决没有小题标题，跳过渲染即可 */
    const SLOT_HIDE_IDS = {
      "1-1": ["title-101", "problems"],
      "1-2": ["title-102", "vproblems"],
      "1-3": ["title-103", "bproblems", "b-gap"],
      "1-4": ["title-104", "cmpproblems"],
      "2-1": ["title-201", "cproblems"],
    };
    hiddenSlot.forEach(k => (SLOT_HIDE_IDS[k] || []).forEach(id => {
      const el = document.getElementById(id);
      if (el) el.hidden = true;
    }));
    /* 板块被隐藏时，顺带隐藏它前面的空行，避免留白 */
    document.querySelectorAll(".blank2").forEach(el => {
      const nx = el.nextElementSibling;
      el.hidden = !!(nx && nx.hidden);
    });
  }

  document.getElementById("btn-new").addEventListener("click", () => {
    showAnswer = false;
    document.getElementById("btn-ans").textContent = "显示答案";
    render();
  });

  document.getElementById("btn-ans").addEventListener("click", e => {
    showAnswer = !showAnswer;
    e.target.textContent = showAnswer ? "隐藏答案" : "显示答案";
    document.querySelectorAll(".ans").forEach(b => {
      b.textContent = showAnswer ? b.dataset.ans : "";
    });
    document.querySelectorAll(".eq-show").forEach(s => { s.hidden = !showAnswer; });
    document.querySelectorAll(".table-ans").forEach(td => {
      td.replaceChildren();
      appendTableCell(td, showAnswer ? td.dataset.ans : (td.dataset.orig !== undefined ? td.dataset.orig : ""));
      td.classList.toggle("ans-shown", showAnswer);
    });
    document.querySelectorAll(".sol").forEach(s => {
      s.style.display = showAnswer ? "block" : "none";
    });
  });

  document.getElementById("btn-print").addEventListener("click", () => window.print());

  /* ---------- 题库导入 ---------- */
  const fileBank = document.getElementById("file-bank");
  const bankStatus = document.getElementById("bank-status");
  const btnClear = document.getElementById("btn-clear");

  function refreshBankUI(msg, ok){
    const n = readImported().length;
    btnClear.hidden = n === 0;
    if (msg){ bankStatus.textContent = msg; bankStatus.style.color = ok ? "#2e7d4f" : "#b3261e"; }
  }

  document.getElementById("btn-import").addEventListener("click", () => fileBank.click());

  fileBank.addEventListener("change", () => {
    const file = fileBank.files && fileBank.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      const raw = String(reader.result);
      /* 选中的是 JSON 题库时走 JSON 解析，不能按 CSV/文本逐行拆，
         否则会把 JSON 的结构行误当成题目（出现“2 个空却有 0 个答案”等报错）。 */
      if (/\.json$/i.test(file.name) || /^\s*[\[{]/.test(raw)){
        loadBankJsonFromText(raw, file.name);
        return;
      }
      const { items, errors } = parseBank(raw);
      if (items.length) saveImported(items);
      render();
      refreshBankUI(
        items.length
          ? `从「${file.name}」导入 ${items.length} 题${errors.length ? `，跳过 ${errors.length} 行` : ""}${errors.length ? "：" + errors[0] : ""}`
          : (errors[0] || `「${file.name}」里没有可导入的题目`),
        items.length > 0
      );
    };
    reader.readAsText(file, "UTF-8");
    fileBank.value = "";
  });

  btnClear.addEventListener("click", () => {
    try { localStorage.removeItem(BANK_KEY); } catch (e) {}
    render();
    refreshBankUI("已清空导入题库", true);
  });

  /* ---------- bank.json 持久化：从 JSON 加载 / 导出为 JSON ---------- */
  function saveBankJson(items){
    const blob = new Blob([JSON.stringify(items, null, 2)], { type: "application/json" });
    const a = document.createElement("a");
    a.download = "bank.json";
    a.href = URL.createObjectURL(blob);
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  }

  function loadBankJsonFromText(text, fileName){
    const label = fileName || "bank.json";
    try {
      const arr = JSON.parse(text);
      if (!Array.isArray(arr)) { alert(`${label} 格式错误：最外层必须是数组`); return null; }
      /* 每条 item 至少要有 text + tags 字段才认为合法 */
      const valid = arr.filter(x => x && typeof x.text === "string" && Array.isArray(x.tags));
      if (!valid.length) { alert(`${label} 里没有有效题目`); return null; }
      /* 控制标签（9xxxx）只负责显示/隐藏，不计入“加载了几道题” */
      const n = valid.filter(x => !(x.tags || []).some(t => /^9\d{4}$/.test(t))).length;
      saveImported(valid);
      render();
      refreshBankUI(`从「${label}」加载了 ${n} 道题`, true);
      return n;
    } catch (e) {
      alert(`${label} 解析失败：` + e.message);
      return null;
    }
  }

  document.getElementById("btn-save-bank").addEventListener("click", () => {
    const cur = readImported();
    if (!cur.length){ alert("当前没有导入题库可导出"); return; }
    saveBankJson(cur);
    refreshBankUI(`已导出 bank.json（${cur.length} 道题）`, true);
  });

  document.getElementById("btn-admin").addEventListener("click", () => {
    /* admin.html 在同目录下，优先尝试打开；不存在则提示 */
    const w = window.open("admin.html", "_blank");
    if (!w) refreshBankUI("请允许弹窗，或手动打开 admin.html", false);
  });

  /* ---------- 前台按钮显示控制（后台「前台设置」写入） ---------- */
  const TOOLBAR_KEY = "xhToolbarConfig_v1";
  const TOOLBAR_BUTTONS = {
    new: "btn-new", ans: "btn-ans", print: "btn-print",
    view: "btn-view", import: "btn-import",
    export: "btn-save-bank", admin: "btn-admin"
  };
  const TOOLBAR_DEFAULTS = {
    new: true, ans: true, print: true, view: true, import: true,
    export: false, admin: false
  };

  function readToolbarConfig(){
    try {
      const v = JSON.parse(localStorage.getItem(TOOLBAR_KEY) || "null");
      return (v && typeof v === "object") ? v : null;
    } catch (e) { return null; }
  }
  function applyToolbarConfig(){
    const cfg = readToolbarConfig();
    const buttons = (cfg && cfg.buttons) ? cfg.buttons : {};
    Object.keys(TOOLBAR_BUTTONS).forEach(key => {
      const el = document.getElementById(TOOLBAR_BUTTONS[key]);
      if (!el) return;
      const on = Object.prototype.hasOwnProperty.call(buttons, key)
        ? buttons[key] !== false
        : TOOLBAR_DEFAULTS[key];
      el.hidden = !on;
    });
  }
  window.addEventListener("storage", e => {
    if (e.key === TOOLBAR_KEY) applyToolbarConfig();
  });

  /* ---------- 出题范围面板 ---------- */
  let viewDraft = {};        /* "大类-slot" → 是否勾选 */
  let viewInventory = [];    /* [{ a:"1", slots:[1,2,3,4] }, ...]，只含导入题库里有的板块 */
  let viewUsingTags = true;  /* 打开面板时是否处于“默认全部应用”状态 */

  function buildViewDraft(){
    const imported = readImported();
    const cfg = readViewConfig();
    const activeCfg = (cfg && cfg.active && cfg.slots) ? cfg : null;
    viewUsingTags = !activeCfg;
    /* 只列出导入标签里出现过的板块；没有导入题的板块不参与计数和显示 */
    viewInventory = ["1", "2", "3", "4", "5"]
      .map(a => ({ a, slots: viewSlots(a, imported) }))
      .filter(x => x.slots.length);
    viewDraft = {};
    viewInventory.forEach(({ a, slots }) => {
      slots.forEach(s => {
        const key = a + "-" + s;
        /* 默认全部应用；已有手动范围则按保存的勾选 */
        viewDraft[key] = activeCfg ? activeCfg.slots[key] === true : true;
      });
    });
  }

  function draftSelectedCount(){
    const imported = readImported();
    let n = 0;
    Object.keys(viewDraft).forEach(key => {
      if (!viewDraft[key]) return;
      const [a, s] = key.split("-");
      n += viewSlotCount(a, parseInt(s, 10), imported);
    });
    return n;
  }

  function updateViewHint(){
    const imported = readImported();
    const onKeys = Object.keys(viewDraft).filter(k => viewDraft[k]);
    const onClasses = viewInventory.filter(({ a, slots }) =>
      slots.some(s => viewDraft[a + "-" + s])).length;
    const hint = document.getElementById("view-hint");
    if (!onKeys.length){
      hint.textContent = "当前一道题都不出，建议至少勾选一个题组。";
    } else {
      let n = 0;
      onKeys.forEach(k => {
        const [a, s] = k.split("-");
        n += viewSlotCount(a, parseInt(s, 10), imported);
      });
      hint.textContent = `已选 ${onClasses} 个板块、${onKeys.length} 个题组，共 ${n} 道题。`;
    }
  }

  function renderViewTree(){
    const tree = document.getElementById("view-tree");
    const scrollTop = tree.scrollTop;
    const imported = readImported();
    tree.innerHTML = "";
    let classPos = 0;
    viewInventory.forEach(({ a, slots }) => {
      const cls = document.createElement("div");
      cls.className = "view-class";

      const head = document.createElement("label");
      head.className = "view-class-head";
      const cb = document.createElement("input");
      cb.type = "checkbox";
      cb.checked = slots.length > 0 && slots.every(s => viewDraft[a + "-" + s]);
      cb.indeterminate = slots.some(s => viewDraft[a + "-" + s]) && !cb.checked;
      const name = document.createElement("span");
      /* 只列出有导入题的板块，序号按面板里实际出现的顺序连续编号 */
      name.textContent = renumberCn(VIEW_CLASS_TITLES[a] || ("大类 " + a), ++classPos);

      let selN = 0, totalN = 0;
      slots.forEach(s => {
        const cnt = viewSlotCount(a, s, imported);
        totalN += cnt;
        if (viewDraft[a + "-" + s]) selN += cnt;
      });
      const count = document.createElement("span");
      count.className = "count";
      count.textContent = `已选 ${selN} / ${totalN} 题`;
      head.append(cb, name, count);

      cb.addEventListener("change", () => {
        slots.forEach(s => { viewDraft[a + "-" + s] = cb.checked; });
        renderViewTree();
        updateViewHint();
      });

      const wrap = document.createElement("div");
      wrap.className = "view-slots";
      slots.forEach(s => {
        const key = a + "-" + s;
        const label = document.createElement("label");
        label.className = "view-slot";
        const scb = document.createElement("input");
        scb.type = "checkbox";
        scb.checked = !!viewDraft[key];
        const txt = document.createElement("span");
        txt.textContent = VIEW_SLOT_LABELS[key] || ("第" + s + "题");
        const tag = document.createElement("span");
        tag.className = "tag";
        tag.textContent = a + String(s).padStart(2, "0") + "xx";
        const cnt = viewSlotCount(a, s, imported);
        const num = document.createElement("span");
        num.className = "n";
        num.textContent = cnt ? cnt + "题" : "无题";
        if (!cnt){
          label.classList.add("empty");
          label.title = "没有可出的题目：该题号没有导入题目";
        }
        scb.addEventListener("change", () => {
          viewDraft[key] = scb.checked;
          renderViewTree();
          updateViewHint();
        });
        label.append(scb, txt, tag, num);
        wrap.appendChild(label);
      });

      cls.append(head, wrap);
      tree.appendChild(cls);
    });
    tree.scrollTop = scrollTop;
  }

  function applyViewPreset(preset){
    viewInventory.forEach(({ a, slots }) => {
      slots.forEach(s => {
        const key = a + "-" + s;
        if (preset === "invert") viewDraft[key] = !viewDraft[key];
        else if (preset.indexOf("only-") === 0) viewDraft[key] = (a === preset.slice(5));
        else viewDraft[key] = (preset === "all");   /* all / none */
      });
    });
    renderViewTree();
    updateViewHint();
  }

  function openViewPanel(){
    buildViewDraft();
    document.getElementById("view-note").textContent = viewUsingTags
      ? "默认已应用全部导入题目（只按导入标签统计，内置题不计入）。取消勾选后点「应用」可收窄范围。"
      : "当前已应用手动出题范围。修改后点「应用」；点「恢复默认」可重新应用全部导入题目。";
    renderViewTree();
    updateViewHint();
    document.getElementById("view-mask").hidden = false;
    document.body.style.overflow = "hidden";
  }

  function closeViewPanel(){
    document.getElementById("view-mask").hidden = true;
    document.body.style.overflow = "";
  }

  function showViewStatus(msg){
    const el = document.getElementById("view-status");
    el.hidden = false;
    el.textContent = msg;
    clearTimeout(showViewStatus.t);
    showViewStatus.t = setTimeout(() => { el.hidden = true; }, 6000);
  }

  document.getElementById("btn-view").addEventListener("click", openViewPanel);
  document.getElementById("view-x").addEventListener("click", closeViewPanel);
  document.getElementById("view-mask").addEventListener("click", e => {
    if (e.target === e.currentTarget) closeViewPanel();
  });
  document.addEventListener("keydown", e => {
    if (e.key === "Escape" && !document.getElementById("view-mask").hidden) closeViewPanel();
  });
  document.getElementById("view-presets").addEventListener("click", e => {
    const btn = e.target.closest("button[data-preset]");
    if (btn) applyViewPreset(btn.dataset.preset);
  });
  document.getElementById("view-apply").addEventListener("click", () => {
    const slots = {};
    Object.keys(viewDraft).forEach(k => { slots[k] = !!viewDraft[k]; });
    writeViewConfig({ version: 1, active: true, slots });
    const n = draftSelectedCount();
    closeViewPanel();
    render();
    showViewStatus(`已应用出题范围：约 ${n} 道题`);
  });
  document.getElementById("view-reset").addEventListener("click", () => {
    if (!viewUsingTags && !confirm("恢复默认后，将重新应用全部导入题目。继续？")) return;
    clearViewConfig();
    closeViewPanel();
    render();
    showViewStatus("已恢复默认：应用全部导入题目");
  });

  /* 启动时自动尝试从 bank.json 加载，失败则用 localStorage */
  applyToolbarConfig();
  (async () => {
    try {
      const res = await fetch("bank.json", { cache: "no-store" });
      if (res.ok){
        const text = await res.text();
        if (text.trim() !== "[]" && text.trim()){
          const arr = JSON.parse(text);
          if (Array.isArray(arr)){
            saveImported(arr);
            refreshBankUI(`已从 bank.json 同步 ${arr.filter(x => x && typeof x.text === "string").length} 道题`, true);
          }
        }
      }
    } catch (e) { /* file:// 下不 fetch，保持 localStorage */ }
    /* 统计“导入题”时不计控制标签（9xxxx），否则会多算 1 条 */
    const importedCount = readImported()
      .filter(it => !(it.tags || []).some(t => /^9\d{4}$/.test(t))).length;
    refreshBankUI(importedCount ? `题库已含 ${importedCount} 道导入题` : "", true);
    render();
  })();
</script>
</body>
</html>
